<!doctype html><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Maqueta de la apertura del sobre</title>
<!-- MAQUETA, no es el juego.

     EL RASGADO. No es cortar el PNG en dos trozos y apartar uno. La rasgadura AVANZA:
     hay una línea de dientes generada una vez, y en cada fotograma sólo está abierta
     hasta donde ha llegado. Lo que queda por delante sigue pegado. La solapa, además,
     se levanta girando sobre el punto exacto donde va la rasgadura en ese momento, que
     es lo que hace una bolsa de verdad: la esquina se despega primero y el desgarro
     corre hacia el otro lado.

     Eso obliga a recalcular el recorte en cada fotograma —el polígono cambia de número
     de vértices—, así que va con requestAnimationFrame y no con una transición de CSS,
     que no sabe interpolar dos polígonos con distinta cantidad de puntos.

     LAS CARTAS. Salen TODAS BOCA ABAJO en un montón. Se toca y la de arriba se da la
     vuelta EN SU SITIO; se toca otra vez y esa se va al FONDO DEL MONTÓN, dejando
     arriba la siguiente, todavía boca abajo. Ninguna se va a ninguna parte.

     Sólo transform y opacity, que es lo único que va fino en el WebView de un móvil. -->
<style>
@font-face{font-family:Saira Condensed;src:url(../juego/fuentes/saira-700-latin.woff2) format('woff2');font-weight:700}
@font-face{font-family:Saira Condensed;src:url(../juego/fuentes/saira-800-latin.woff2) format('woff2');font-weight:800}
@font-face{font-family:Saira Condensed;src:url(../juego/fuentes/saira-600-latin.woff2) format('woff2');font-weight:600}

:root{
  --oro:#d9a441; --oro-claro:#f2cf7e;
  --cromo:linear-gradient(180deg,#fff 0%,#e6e6e6 38%,#9d9da1 55%,#f2f2f2 74%,#b9b9bd 100%);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#0a0708;overflow:hidden;
  font-family:"Saira Condensed",sans-serif;color:#f8f5ee;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}

#escena{position:fixed;inset:0;display:grid;place-items:center;perspective:1400px}

/* ── EL SOBRE ──────────────────────────────────────────────────────────────── */
#sobre{position:relative;width:min(80vw,calc(66vh * 1024 / 1536));aspect-ratio:1024/1536;
  cursor:pointer;transition:transform .16s ease}
#sobre.toque{transform:scale(.975)}
#sobre .parte{position:absolute;inset:0;
  background:url(../originales/sobres-v2/1-basico.png) center/100% 100% no-repeat;
  filter:drop-shadow(0 26px 60px rgba(0,0,0,.85))}

#sobre .lustre{position:absolute;inset:0;pointer-events:none;overflow:hidden;
  -webkit-mask-image:url(../originales/sobres-v2/1-basico.png);
  mask-image:url(../originales/sobres-v2/1-basico.png);
  -webkit-mask-size:100% 100%;mask-size:100% 100%}
#sobre .lustre::after{content:'';position:absolute;top:-30%;left:-60%;width:40%;height:160%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.16),transparent);
  transform:translateX(0) rotate(8deg);animation:pasa 3.4s ease-in-out infinite}
@keyframes pasa{0%,62%{transform:translateX(0) rotate(8deg)}
                100%{transform:translateX(420%) rotate(8deg)}}
#sobre.rasgando .lustre{opacity:0;transition:opacity .2s}

/* Cuando la rasgadura llega al final, la solapa ya suelta se va y el cuerpo cae. */
#sobre.suelta .alto{animation:vuela .46s cubic-bezier(.35,.05,.6,1) forwards}
@keyframes vuela{to{transform:translate3d(26%,-56%,0) rotate(34deg);opacity:0}}
#sobre.suelta .bajo{animation:cae .8s cubic-bezier(.4,0,.7,1) .16s forwards}
@keyframes cae{to{transform:translate3d(0,38%,0) rotate(2deg);opacity:0}}

/* ── EL MONTÓN ─────────────────────────────────────────────────────────────
   Todas las cartas viven en el mismo sitio; lo único que cambia es su puesto en la
   pila, y de ahí salen su desplazamiento, su escala y su orden. Pasar una al fondo
   es cambiarle el puesto, no llevársela a otra parte. */
#monton{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.carta{position:absolute;width:min(74vw,calc(58vh * 1054 / 1492));aspect-ratio:1054/1492;
  transform-style:preserve-3d;
  /* LA PERSPECTIVA VA AQUÍ, en la carta, y no en la escena: puesta arriba se aplica sólo
     a los hijos directos, y entre medias hay dos capas que aplanan el 3D. Sin ella el
     giro no es un giro, es la carta encogiéndose de ancho y volviendo a crecer. */
  perspective:1150px;
  --i:0;                       /* puesto en la pila: 0 es la de arriba */
  transform:translate3d(0, calc(var(--i) * 1.2%), 0) scale(calc(1 - var(--i) * .028));
  z-index:calc(50 - var(--i));
  transition:transform .42s cubic-bezier(.25,.8,.3,1);
  will-change:transform}
/* Al salir del sobre nacen dentro del cuerpo y suben a su puesto, en cascada. */
.carta.dentro{transform:translate3d(0,46%,0) scale(.34);opacity:0}
#monton.sale .carta{transition:transform .55s cubic-bezier(.2,.85,.3,1) var(--r),
                               opacity .3s ease var(--r)}

/* PASAR UNA CARTA AL FONDO. No desaparece ni se encoge en el sitio: sale por el lado
   y hacia abajo, da la vuelta y se mete por detrás, que es lo que hace la mano cuando
   pasas la de arriba a la parte de atrás del montón. --fin es el puesto al que va. */
.carta.pasando{animation:pasar .58s cubic-bezier(.42,0,.35,1) forwards}
@keyframes pasar{
  0%  {transform:translate3d(0,0,0) scale(1) rotate(0deg)}
  46% {transform:translate3d(64%,17%,0) scale(.94) rotate(9deg)}
  78% {transform:translate3d(30%,10%,0) scale(.90) rotate(4deg)}
  100%{transform:translate3d(0, calc(var(--fin) * 1.2%), 0)
                scale(calc(1 - var(--fin) * .028)) rotate(0deg)}}

/* Las dos caras. */
.gira{position:absolute;inset:0;transform-style:preserve-3d;
  transition:transform .62s cubic-bezier(.42,.02,.28,1)}
.carta.bocabajo .gira{transform:rotateY(180deg)}
/* NO NOS FIAMOS DE backface-visibility: con el estilo calculado correcto, Chromium
   pintaba el dorso ENCIMA de la cara y todas salían boca abajo. En el WebView de
   Android esa propiedad ha ido mal históricamente. El cambio de cara se hace a mano,
   de golpe y a mitad del giro, que es cuando la carta está de canto. */
/* Las dos caras van SEPARADAS EN PROFUNDIDAD, 5 px cada una a su lado: así la carta es
   un objeto con un grosor y no dos dibujos pegados, y al pasar de canto se nota. */
.cara{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  transition:opacity 0s linear .275s}
.cara.frente{transform:translateZ(5px)}
.cara.dorso{transform:rotateY(180deg) translateZ(5px)}

/* El reflejo que cruza la carta mientras gira: es lo que la hace parecer una lámina y no
   una imagen. Va sólo durante el giro, y el destello cae justo cuando pasa de canto. */
.brillo{position:absolute;inset:0;pointer-events:none;border-radius:14px;opacity:0;
  background:linear-gradient(104deg,transparent 28%,rgba(255,255,255,.42) 47%,
             rgba(255,255,255,.06) 58%,transparent 72%)}
.carta.volteando .brillo{animation:destello .62s ease-out}
@keyframes destello{
  0%{opacity:0;transform:translateX(-38%)}
  46%{opacity:.9}
  100%{opacity:0;transform:translateX(38%)}}
.cara > .recorte{position:absolute;inset:0;border-radius:14px;overflow:hidden;
  box-shadow:0 18px 40px rgba(0,0,0,.8)}
.carta .frente{opacity:1}
.carta .dorso{opacity:0}
.carta.bocabajo .frente{opacity:0}
.carta.bocabajo .dorso{opacity:1}
.cara.dorso > .recorte{background:url(../originales/marcos-v2/comun-reverso.png)
  center/100% 100% no-repeat}

/* ── LA CARA DE LA CARTA ─────────────────────────────────────────────────── */
.lienzo{position:absolute;left:0;top:0;width:1054px;height:1492px;
  transform:scale(var(--k));transform-origin:0 0;overflow:hidden}
.marco{position:absolute;inset:0;width:100%;height:100%;z-index:0}
.hueco{position:absolute;left:6.93%;right:7.13%;top:4.23%;height:71%;z-index:1;overflow:hidden}
.hueco img{position:absolute;left:50%;bottom:0;height:97%;transform:translateX(-50%)}
.hueco::after{content:'';position:absolute;left:0;right:0;bottom:0;height:26%;
  background:linear-gradient(180deg,transparent,#000 88%)}
.capa{position:absolute;inset:0;z-index:2}
.marca{position:absolute;left:6.9%;top:3.5%;width:9.0%;opacity:.95}
.nombre{position:absolute;left:4%;right:4%;top:63.4%;text-align:center;text-transform:uppercase;
  font-weight:800;font-size:132px;line-height:1;letter-spacing:-.005em;transform:skewX(-9deg);
  background-image:var(--cromo);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 5px 12px rgba(0,0,0,.85))}
.apodo{position:absolute;left:0;right:0;top:73.5%;display:flex;align-items:center;
  justify-content:center;gap:26px}
.apodo b{font-weight:700;font-size:48px;line-height:1;letter-spacing:.20em;
  color:var(--oro-claro);transform:skewX(-9deg);text-indent:.20em}
.apodo i{display:block;width:110px;height:2px;
  background:linear-gradient(90deg,transparent,var(--oro));opacity:.85}
.apodo i:last-child{background:linear-gradient(90deg,var(--oro),transparent)}
.datos{position:absolute;left:0;right:0;top:78.4%;height:5.0%;
  display:flex;align-items:center;justify-content:center}
.datos > *{display:flex;align-items:center;justify-content:center}
.datos .cel{width:19%}
.datos .sep{width:2px;height:74%;background:var(--oro);opacity:.75}
.datos img{height:56%;width:auto}
.datos b{font-weight:700;font-size:62px;line-height:1;
  background-image:var(--cromo);-webkit-background-clip:text;background-clip:text;color:transparent}
.stats{position:absolute;left:7%;right:7%;top:84%;height:10.6%;
  border:2px solid rgba(217,164,65,.55);
  background:linear-gradient(180deg,rgba(0,0,0,.55),rgba(0,0,0,.30));
  clip-path:polygon(26px 0,calc(100% - 26px) 0,100% 26px,100% calc(100% - 26px),
                    calc(100% - 26px) 100%,26px 100%,0 calc(100% - 26px),0 26px);
  display:grid;grid-template-columns:repeat(6,1fr)}
.stats .st{position:relative;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:6px}
.stats .st + .st::before{content:'';position:absolute;left:0;top:22%;bottom:22%;width:2px;
  background:var(--oro);opacity:.55}
.stats .et{font-weight:700;font-size:39px;line-height:1;letter-spacing:.10em;
  color:var(--oro-claro);transform:skewX(-9deg);text-indent:.10em}
.stats .nu{font-weight:800;font-size:62px;line-height:1;
  background-image:var(--cromo);-webkit-background-clip:text;background-clip:text;color:transparent}

/* ── AVISOS ──────────────────────────────────────────────────────────────── */
#pista{position:fixed;left:0;right:0;bottom:5vh;text-align:center;z-index:80;
  font-size:clamp(15px,3.6vw,20px);letter-spacing:.16em;text-transform:uppercase;
  color:#cdbfb4;opacity:0;transition:opacity .3s ease;pointer-events:none}
#pista.on{opacity:.95}
#cuenta{position:fixed;left:0;right:0;top:5vh;text-align:center;z-index:80;
  font-size:clamp(13px,3vw,16px);letter-spacing:.22em;color:#7d6f68;opacity:0;
  transition:opacity .3s ease;pointer-events:none}
#cuenta.on{opacity:1}
#otra{position:fixed;right:14px;top:14px;z-index:90;font:600 13px/1 "Saira Condensed",sans-serif;
  letter-spacing:.12em;text-transform:uppercase;color:#8b7d74;background:#1a1211;
  border:1px solid #3a2b28;border-radius:999px;padding:9px 15px;cursor:pointer}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms !important;
  animation-duration:.01ms !important}}
</style>

<div id="escena">
  <div id="sobre">
    <div class="parte bajo"></div>
    <div class="parte alto"></div>
    <div class="lustre"></div>
  </div>
  <div id="monton"></div>
</div>
<div id="cuenta"></div>
<div id="pista">Toca el sobre</div>
<button id="otra">Otra vez</button>

<script>
const CARTAS = [
  {p:'paddy-pimblett',   n:'Paddy Pimblett',   a:'THE BADDY',   b:'gb-eng', d:'LW', rk:'#5', s:[81,80,86,78,88,80]},
  {p:'max-holloway',     n:'Max Holloway',     a:'BLESSED',     b:'us',     d:'LW', rk:'#4', s:[86,82,76,85,82,87]},
  {p:'sean-o-malley',    n:"Sean O'Malley",    a:'SUGA',        b:'us',     d:'BW', rk:'#2', s:[87,77,79,83,88,86]},
  {p:'merab-dvalishvili',n:'Merab Dvalishvili',a:'THE MACHINE', b:'ge',     d:'BW', rk:'#1', s:[80,88,76,88,88,86]},
  {p:'ilia-topuria',     n:'Ilia Topuria',     a:'EL MATADOR',  b:'es',     d:'FW', rk:'C',  s:[88,86,82,79,88,87]},
];
const ET = ['GOL','LUC','SUE','CAR','DUR','IQ'];

const $ = s => document.querySelector(s);
const sobre = $('#sobre'), monton = $('#monton'),
      pista = $('#pista'), cuenta = $('#cuenta');
const alto = sobre.querySelector('.alto'), bajo = sobre.querySelector('.bajo');

/* ── LA RASGADURA ────────────────────────────────────────────────────────────
   Los dientes se generan UNA vez, así que la línea es siempre la misma y los dos
   trozos encajan diente con diente por construcción. Lo que cambia en cada
   fotograma es hasta dónde está abierta. */
const CORTE = 11.5;                 // % del alto: justo bajo la banda de pliegues
const N = 34;
const DIENTES = Array.from({length: N + 1}, (_, i) => {
  const x = 100 * i / N;
  // Alternos y desiguales: un peine regular no parece un desgarro.
  const v = (i % 2 ? -1 : 1) * (0.75 + 0.55 * Math.abs(Math.sin(i * 2.7)));
  return { x, y: CORTE + v };
});

/* El recorte de cada trozo cuando la rasgadura ha llegado a p (0..1). Por delante de p
   los dos trozos siguen pegados: el corte de la solapa baja recto hasta el borde de
   arriba y el del cuerpo sube por el mismo sitio, así que no queda hueco entre ellos. */
function recortes(p) {
  const hasta = p * 100;
  const linea = DIENTES.filter(d => d.x <= hasta);
  // El punto exacto donde va el desgarro ahora mismo, interpolado entre dos dientes.
  const j = Math.min(DIENTES.length - 1, linea.length);
  const a = DIENTES[Math.max(0, j - 1)], b = DIENTES[j];
  const t = b.x === a.x ? 0 : (hasta - a.x) / (b.x - a.x);
  const punta = { x: hasta, y: a.y + (b.y - a.y) * t };
  if (!linea.length || linea[linea.length - 1].x < hasta) linea.push(punta);

  const pts = linea.map(d => `${d.x.toFixed(2)}% ${d.y.toFixed(2)}%`);
  return {
    alto: `polygon(0% 0%, ${hasta.toFixed(2)}% 0%, ${pts.slice().reverse().join(', ')})`,
    bajo: `polygon(${pts.join(', ')}, ${hasta.toFixed(2)}% 0%, 100% 0%, 100% 100%, 0% 100%)`,
    punta,
  };
}

function pintaRasgadura(p) {
  const r = recortes(p);
  alto.style.clipPath = r.alto;
  bajo.style.clipPath = r.bajo;
  /* La solapa se levanta girando sobre el punto donde ESTÁ el desgarro: la esquina se
     despega primero y el giro crece según avanza. El pliegue del plástico se sugiere
     con un poco de skew. */
  alto.style.transformOrigin = `${(p * 100).toFixed(2)}% ${r.punta.y.toFixed(2)}%`;
  /* El giro crece casi desde el principio: si va con p al cuadrado, a media rasgadura
     son cuatro grados y no se ve nada. Con esto la esquina ya está despegada cuando el
     desgarro va por la mitad, que es lo que se ve al abrir una bolsa. */
  alto.style.transform = `rotate(${(-34 * Math.pow(p, .85)).toFixed(2)}deg) `
    + `skewX(${(-6 * p).toFixed(2)}deg) translateY(${(-1.6 * p).toFixed(2)}%)`;
  /* El cuerpo acusa el tirón y se inclina un pelo hacia el otro lado. */
  bajo.style.transform = `rotate(${(0.9 * p).toFixed(2)}deg)`;
}

/* ── LA PILA ─────────────────────────────────────────────────────────────── */
function pintaCara(c) {
  return `<div class="lienzo">
    <img class="marco" src="../originales/marcos-v2/comun-frente.png" alt="">
    <div class="hueco"><img src="../juego/fotos/${c.p}.webp" alt=""></div>
    <div class="capa">
      <img class="marca" src="../originales/marcos-v2/monograma.png" alt="">
      <div class="nombre">${c.n}</div>
      <div class="apodo"><i></i><b>${c.a}</b><i></i></div>
      <div class="datos">
        <span class="cel"><img src="../juego/banderas/${c.b}.webp" alt=""></span>
        <span class="sep"></span><span class="cel"><b>${c.d}</b></span>
        <span class="sep"></span><span class="cel"><b>${c.rk}</b></span>
      </div>
      <div class="stats">${c.s.map((v,i)=>
        `<div class="st"><span class="et">${ET[i]}</span><span class="nu">${v}</span></div>`).join('')}</div>
    </div>
  </div>`;
}

/* offsetWidth Y NO getBoundingClientRect: el segundo devuelve el ancho YA TRANSFORMADO,
   y las cartas nacen dentro del sobre a escala 0,34. Midiendo así, --k salía tres veces
   más pequeño de la cuenta y las cartas se pintaban en miniatura en su esquina. */
function ajustaK() {
  monton.querySelectorAll('.carta').forEach(el => {
    const k = el.offsetWidth / 1054;
    el.querySelectorAll('.lienzo').forEach(l => l.style.setProperty('--k', k));
  });
}

let pila = [], vistas = 0, fase = 'cerrado';
const colocar = () => pila.forEach((el, i) => el.style.setProperty('--i', i));

function montar() {
  fase = 'cerrado'; vistas = 0;
  sobre.className = ''; sobre.style.display = '';
  alto.style.cssText = ''; bajo.style.cssText = '';
  pintaRasgadura(0);
  monton.className = '';
  monton.innerHTML = CARTAS.map((c, i) => `
    <div class="carta dentro bocabajo" style="--r:${i*55}ms">
      <div class="gira">
        <div class="cara frente"><div class="recorte">${pintaCara(c)}</div><span class="brillo"></span></div>
        <div class="cara dorso"><div class="recorte"></div><span class="brillo"></span></div>
      </div>
    </div>`).join('');
  pila = [...monton.querySelectorAll('.carta')];
  colocar();
  ajustaK();
  cuenta.classList.remove('on');
  pista.textContent = 'Toca el sobre';
  pista.classList.add('on');
}

/* Rasga de verdad: la abertura AVANZA con el tiempo, no aparece de golpe. */
function rasgar() {
  if (fase !== 'cerrado') return;
  fase = 'rasgando';
  pista.classList.remove('on');
  sobre.classList.add('toque');
  setTimeout(() => sobre.classList.remove('toque'), 140);
  sobre.classList.add('rasgando');

  const DUR = 900, t0 = performance.now();
  (function paso(t) {
    const u = Math.min(1, (t - t0) / DUR);
    // Cuesta arrancar y luego corre: es como se abre una bolsa de verdad.
    const p = u < .32 ? (u / .32) * .16 : .16 + .84 * Math.pow((u - .32) / .68, .75);
    pintaRasgadura(p);
    if (u < 1) requestAnimationFrame(paso); else soltar();
  })(t0);
}

function soltar() {
  sobre.classList.add('suelta');
  setTimeout(() => {
    monton.classList.add('sale');
    pila.forEach(el => el.classList.remove('dentro'));
    setTimeout(() => { sobre.style.display = 'none'; fase = 'tapada'; avisa(); }, 620);
  }, 170);
}

function avisa() {
  cuenta.textContent = `${vistas} de ${CARTAS.length}`;
  cuenta.classList.add('on');
  pista.textContent = fase === 'tapada' ? 'Toca para darle la vuelta' : 'Toca para pasarla';
  pista.classList.add('on');
}

function toque() {
  if (fase === 'cerrado') { rasgar(); return; }
  if (fase === 'rasgando' || fase === 'pasando') return;
  const arriba = pila[0];

  if (fase === 'tapada') {
    arriba.classList.remove('bocabajo');       // se le da la vuelta EN SU SITIO
    arriba.classList.add('volteando');
    setTimeout(() => arriba.classList.remove('volteando'), 640);
    if (!arriba.dataset.vista) { arriba.dataset.vista = '1'; vistas++; }
    fase = 'vista';
    avisa();
    return;
  }

  if (fase === 'vista') {
    /* Sale por el lado y hacia abajo y se mete por detrás. Se queda delante hasta que
       ha salido del montón —si no, se metería por debajo nada más empezar— y ahí se le
       baja el orden. */
    fase = 'pasando';
    arriba.style.setProperty('--fin', pila.length - 1);
    arriba.classList.add('pasando');
    setTimeout(() => { arriba.style.zIndex = 0; }, 260);
    setTimeout(() => {
      pila.push(pila.shift());
      arriba.classList.remove('pasando');
      arriba.style.zIndex = '';
      arriba.style.removeProperty('--fin');
      colocar();
      /* Nunca se acaba: se sigue pasando en círculo, y las ya vistas siguen boca
         arriba, así que dar otra vuelta es repasarlas todas. */
      fase = arriba === pila[0] || pila[0].classList.contains('bocabajo')
        ? 'tapada' : 'vista';
      avisa();
    }, 580);
  }
}

addEventListener('pointerdown', e => { if (e.target.id !== 'otra') toque(); });
$('#otra').addEventListener('click', montar);
addEventListener('resize', ajustaK);
montar();
</script>
