<!doctype html><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Maqueta de la apertura del sobre</title>
<!-- MAQUETA, no es el juego. Es la apertura tal como la pidió el dueño:

       toca el sobre → la parte de arriba se rasga por el dentado y sale volando
       → el montón de cartas sube desde dentro del cuerpo → se revelan una a una
       → y la última se queda BOCA ABAJO, que es la que puede ser la buena.

     Sin librerías: sólo transform y opacity, que es lo único que va fino en el WebView
     de un móvil. Nada de width/height/top animados, que obligan a recalcular la página
     en cada fotograma.

     EL RASGADO NO ES UNA IMAGEN RECORTADA. El sobre se pinta DOS VECES, la misma
     imagen, y cada copia se recorta con un clip-path que comparte la misma línea de
     dientes: la de arriba se queda con lo de encima de la línea y la de abajo con lo de
     debajo. Así el corte encaja diente con diente y no hace falta preparar archivos. -->
<style>
@font-face{font-family:Saira Condensed;src:url(../juego/fuentes/saira-700-latin.woff2) format('woff2');font-weight:700}
@font-face{font-family:Saira Condensed;src:url(../juego/fuentes/saira-800-latin.woff2) format('woff2');font-weight:800}
@font-face{font-family:Saira Condensed;src:url(../juego/fuentes/saira-600-latin.woff2) format('woff2');font-weight:600}

:root{
  --oro:#d9a441; --oro-claro:#f2cf7e;
  --cromo:linear-gradient(180deg,#fff 0%,#e6e6e6 38%,#9d9da1 55%,#f2f2f2 74%,#b9b9bd 100%);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#0a0708;overflow:hidden;
  font-family:"Saira Condensed",sans-serif;color:#f8f5ee;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}

#escena{position:fixed;inset:0;display:grid;place-items:center;perspective:1400px}

/* ── EL SOBRE ────────────────────────────────────────────────────────────────
   Dos copias de la misma imagen, cada una recortada por su lado de la línea de
   dientes. --corte es dónde cae esa línea, en % del alto del sobre. */
#sobre{position:relative;width:min(64vw,calc(58vh * 1024 / 1536));aspect-ratio:1024/1536;
  cursor:pointer;transition:transform .18s ease}
#sobre.toque{transform:scale(.97)}
#sobre .parte{position:absolute;inset:0;background:url(../originales/sobres-v2/1-basico.png)
  center/100% 100% no-repeat;
  filter:drop-shadow(0 26px 60px rgba(0,0,0,.85))}

/* El brillo que recorre el plástico mientras está cerrado: dice "esto se toca". */
#sobre .lustre{position:absolute;inset:0;pointer-events:none;overflow:hidden;
  -webkit-mask-image:url(../originales/sobres-v2/1-basico.png);
  mask-image:url(../originales/sobres-v2/1-basico.png);
  -webkit-mask-size:100% 100%;mask-size:100% 100%}
#sobre .lustre::after{content:'';position:absolute;top:-30%;left:-60%;width:40%;height:160%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.16),transparent);
  transform:translateX(0) rotate(8deg);animation:pasa 3.4s ease-in-out infinite}
@keyframes pasa{0%,62%{transform:translateX(0) rotate(8deg)}
                100%{transform:translateX(420%) rotate(8deg)}}

/* Al rasgar: la solapa gira y se va, el cuerpo se hunde y se apaga. */
#sobre.abierto .lustre{opacity:0}
#sobre.abierto .alto{animation:vuela .78s cubic-bezier(.3,.05,.6,1) forwards}
#sobre.abierto .bajo{animation:cae 1.05s cubic-bezier(.4,0,.7,1) .30s forwards}
@keyframes vuela{
  0%  {transform:translate3d(0,0,0) rotate(0deg);opacity:1}
  18% {transform:translate3d(0,-2%,0) rotate(-1.5deg);opacity:1}
  100%{transform:translate3d(26%,-88%,0) rotate(24deg);opacity:0}}
@keyframes cae{
  0%  {transform:translate3d(0,0,0) rotate(0);opacity:1}
  100%{transform:translate3d(0,34%,0) rotate(3deg);opacity:0}}

/* ── EL MONTÓN DE CARTAS ─────────────────────────────────────────────────────
   Nacen dentro del cuerpo del sobre —de ahí que empiecen bajas y pequeñas— y
   suben. Cada una lleva su retraso, así que salen en cascada y no en bloque. */
#monton{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.carta{position:absolute;width:min(74vw,calc(58vh * 1054 / 1492));aspect-ratio:1054/1492;
  transform-style:preserve-3d;opacity:0;
  /* El orden va por variable y NO en el atributo style: un z-index escrito en línea le
     gana a cualquier regla, y la carta que se está revelando se quedaba detrás del
     montón. */
  z-index:var(--z,0);
  will-change:transform,opacity}
#monton.sale .carta{animation:sube .62s cubic-bezier(.2,.8,.3,1) forwards;
  animation-delay:var(--r)}
@keyframes sube{
  0%  {transform:translate3d(0,42%,0) scale(.42) rotate(var(--giro));opacity:0}
  40% {opacity:1}
  100%{transform:translate3d(var(--dx),var(--dy),0) scale(.62) rotate(var(--giro));opacity:1}}

/* La carta que está siendo revelada: al frente, grande y derecha. */
.carta.mirando{animation:alfrente .5s cubic-bezier(.2,.8,.3,1) forwards !important;
  z-index:50}
@keyframes alfrente{to{transform:translate3d(0,0,0) scale(1) rotate(0deg);opacity:1}}
/* Y cuando pasa a la siguiente, se aparta al montón de vistas. */
.carta.vista{animation:aparta .45s cubic-bezier(.4,0,.6,1) forwards !important;z-index:10}
@keyframes aparta{to{transform:translate3d(var(--vx),-34vh,0) scale(.30) rotate(var(--vg));opacity:.9}}

/* Las dos caras. La de atrás va girada media vuelta y el contenedor gira entero. */
.gira{position:absolute;inset:0;transform-style:preserve-3d;
  transition:transform .62s cubic-bezier(.3,.7,.3,1)}
.carta.bocabajo .gira{transform:rotateY(180deg)}
/* NO NOS FIAMOS DE backface-visibility, y no es manía: aquí, con el estilo calculado
   correcto -hidden en las dos caras y rotateY(180deg) en el dorso-, Chromium seguía
   pintando el dorso ENCIMA de la cara y las cinco cartas salían boca abajo. En el WebView
   de Android esa propiedad ha ido mal históricamente, así que el cambio de cara se hace a
   mano: cada cara se apaga o se enciende de golpe -0s de transición- a mitad del giro,
   que es cuando la carta está de canto y no se ve nada. Se queda puesta igualmente, que
   no estorba y ayuda donde sí funciona. */
.cara{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  transition:opacity 0s linear .31s}
.carta .frente{opacity:1}
.carta .dorso{opacity:0}
.carta.bocabajo .frente{opacity:0}
.carta.bocabajo .dorso{opacity:1}
.cara > .recorte{position:absolute;inset:0;border-radius:14px;overflow:hidden;
  box-shadow:0 18px 40px rgba(0,0,0,.8)}
.cara.dorso{transform:rotateY(180deg)}
.cara.dorso > .recorte{background:url(../originales/marcos-v2/comun-reverso.png)
  center/100% 100% no-repeat}

/* ── LA CARA DE LA CARTA ─────────────────────────────────────────────────────
   El mismo reparto de herramientas/maqueta-carta.html, en % del lienzo. */
.lienzo{position:absolute;left:0;top:0;width:1054px;height:1492px;
  transform:scale(var(--k));transform-origin:0 0;overflow:hidden}
.marco{position:absolute;inset:0;width:100%;height:100%;z-index:0}
.hueco{position:absolute;left:6.93%;right:7.13%;top:4.23%;height:71%;z-index:1;overflow:hidden}
.hueco img{position:absolute;left:50%;bottom:0;height:97%;transform:translateX(-50%)}
.hueco::after{content:'';position:absolute;left:0;right:0;bottom:0;height:26%;
  background:linear-gradient(180deg,transparent,#000 88%)}
.capa{position:absolute;inset:0;z-index:2}
.marca{position:absolute;left:6.9%;top:3.5%;width:9.0%;opacity:.95}
.nombre{position:absolute;left:4%;right:4%;top:63.4%;text-align:center;text-transform:uppercase;
  font-weight:800;font-size:132px;line-height:1;letter-spacing:-.005em;transform:skewX(-9deg);
  background-image:var(--cromo);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 5px 12px rgba(0,0,0,.85))}
.apodo{position:absolute;left:0;right:0;top:73.5%;display:flex;align-items:center;
  justify-content:center;gap:26px}
.apodo b{font-weight:700;font-size:48px;line-height:1;letter-spacing:.20em;
  color:var(--oro-claro);transform:skewX(-9deg);text-indent:.20em}
.apodo i{display:block;width:110px;height:2px;
  background:linear-gradient(90deg,transparent,var(--oro));opacity:.85}
.apodo i:last-child{background:linear-gradient(90deg,var(--oro),transparent)}
.datos{position:absolute;left:0;right:0;top:78.4%;height:5.0%;
  display:flex;align-items:center;justify-content:center}
.datos > *{display:flex;align-items:center;justify-content:center}
.datos .cel{width:19%}
.datos .sep{width:2px;height:74%;background:var(--oro);opacity:.75}
.datos img{height:56%;width:auto}
.datos b{font-weight:700;font-size:62px;line-height:1;
  background-image:var(--cromo);-webkit-background-clip:text;background-clip:text;color:transparent}
.stats{position:absolute;left:7%;right:7%;top:84%;height:10.6%;
  border:2px solid rgba(217,164,65,.55);
  background:linear-gradient(180deg,rgba(0,0,0,.55),rgba(0,0,0,.30));
  clip-path:polygon(26px 0,calc(100% - 26px) 0,100% 26px,100% calc(100% - 26px),
                    calc(100% - 26px) 100%,26px 100%,0 calc(100% - 26px),0 26px);
  display:grid;grid-template-columns:repeat(6,1fr)}
.stats .st{position:relative;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:6px}
.stats .st + .st::before{content:'';position:absolute;left:0;top:22%;bottom:22%;width:2px;
  background:var(--oro);opacity:.55}
.stats .et{font-weight:700;font-size:39px;line-height:1;letter-spacing:.10em;
  color:var(--oro-claro);transform:skewX(-9deg);text-indent:.10em}
.stats .nu{font-weight:800;font-size:62px;line-height:1;
  background-image:var(--cromo);-webkit-background-clip:text;background-clip:text;color:transparent}

/* ── AVISOS ──────────────────────────────────────────────────────────────── */
#pista{position:fixed;left:0;right:0;bottom:6vh;text-align:center;z-index:80;
  font-size:clamp(15px,3.6vw,20px);letter-spacing:.16em;text-transform:uppercase;
  color:#cdbfb4;opacity:0;transition:opacity .35s ease;pointer-events:none}
#pista.on{opacity:.95}
#otra{position:fixed;right:14px;top:14px;z-index:90;font:600 13px/1 "Saira Condensed",sans-serif;
  letter-spacing:.12em;text-transform:uppercase;color:#8b7d74;background:#1a1211;
  border:1px solid #3a2b28;border-radius:999px;padding:9px 15px;cursor:pointer}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important}}
</style>

<div id="escena">
  <div id="sobre">
    <div class="parte bajo"></div>
    <div class="parte alto"></div>
    <div class="lustre"></div>
  </div>
  <div id="monton"></div>
</div>
<div id="pista">Toca el sobre</div>
<button id="otra">Otra vez</button>

<script>
/* Los cinco peleadores del ejemplo, con sus stats de verdad del plantel. El último es
   el bueno: es el que se queda boca abajo. */
const CARTAS = [
  {p:'paddy-pimblett',   n:'Paddy Pimblett',   a:'THE BADDY',     b:'gb-eng', d:'LW', rk:'#5', s:[81,80,86,78,88,80]},
  {p:'max-holloway',     n:'Max Holloway',     a:'BLESSED',       b:'us',     d:'LW', rk:'#4', s:[86,82,76,85,82,87]},
  {p:'sean-o-malley',    n:"Sean O'Malley",    a:'SUGA',          b:'us',     d:'BW', rk:'#2', s:[87,77,79,83,88,86]},
  {p:'merab-dvalishvili',n:'Merab Dvalishvili',a:'THE MACHINE',   b:'ge',     d:'BW', rk:'#1', s:[80,88,76,88,88,86]},
  {p:'ilia-topuria',     n:'Ilia Topuria',     a:'EL MATADOR',    b:'es',     d:'FW', rk:'C',  s:[88,86,82,79,88,87]},
];
const ET = ['GOL','LUC','SUE','CAR','DUR','IQ'];

const $ = s => document.querySelector(s);
const sobre = $('#sobre'), monton = $('#monton'), pista = $('#pista');

/* LA LÍNEA DE DIENTES. Se genera una sola vez y se le da a las dos copias del sobre:
   la de arriba se queda con lo de encima y la de abajo con lo de debajo, así que el
   corte encaja diente con diente por construcción. */
function dientes(corte, n = 22, alto = 1.15) {
  const arriba = [], abajo = [];
  for (let i = 0; i <= n; i++) {
    const x = (100 * i / n);
    // Diente arriba y abajo alternando, con una variación fija para que no sea un peine.
    const v = (i % 2 ? -1 : 1) * alto * (0.7 + 0.3 * Math.sin(i * 2.1));
    const y = corte + v;
    arriba.push(`${x.toFixed(2)}% ${y.toFixed(2)}%`);
    abajo.push(`${x.toFixed(2)}% ${y.toFixed(2)}%`);
  }
  return {
    alto: `polygon(0% 0%, 100% 0%, ${arriba.slice().reverse().join(', ')}, 0% 0%)`,
    bajo: `polygon(${abajo.join(', ')}, 100% 100%, 0% 100%)`,
  };
}
/* 11,5% del alto: justo por debajo de la banda de pliegues de arriba, que es por donde
   se rasga un sobre de verdad. */
const CORTE = dientes(11.5);
sobre.querySelector('.alto').style.clipPath = CORTE.alto;
sobre.querySelector('.bajo').style.clipPath = CORTE.bajo;

function pintaCara(c) {
  return `<div class="lienzo">
    <img class="marco" src="../originales/marcos-v2/comun-frente.png" alt="">
    <div class="hueco"><img src="../juego/fotos/${c.p}.webp" alt=""></div>
    <div class="capa">
      <img class="marca" src="../originales/marcos-v2/monograma.png" alt="">
      <div class="nombre">${c.n}</div>
      <div class="apodo"><i></i><b>${c.a}</b><i></i></div>
      <div class="datos">
        <span class="cel"><img src="../juego/banderas/${c.b}.webp" alt=""></span>
        <span class="sep"></span><span class="cel"><b>${c.d}</b></span>
        <span class="sep"></span><span class="cel"><b>${c.rk}</b></span>
      </div>
      <div class="stats">${c.s.map((v,i)=>
        `<div class="st"><span class="et">${ET[i]}</span><span class="nu">${v}</span></div>`).join('')}</div>
    </div>
  </div>`;
}

/* El lienzo va a 1054 px fijos y se encoge con transform: así ningún mínimo de fuente
   del WebView puede meterse por medio y descuadrar la carta. */
function ajustaK() {
  monton.querySelectorAll('.carta').forEach(el => {
    const k = el.getBoundingClientRect().width / 1054;
    el.querySelectorAll('.lienzo').forEach(l => l.style.setProperty('--k', k));
  });
}

let paso = -1, cartas = [];

function montar() {
  monton.className = '';
  monton.innerHTML = CARTAS.map((c, i) => `
    <div class="carta" style="--r:${(i*70)}ms;--giro:${(i-2)*2.2}deg;
         --dx:${(i-2)*1.6}%;--dy:${-i*1.1}%;--vx:${(i%2?1:-1)*26}vw;--vg:${(i%2?7:-7)}deg;
         --z:${i}">
      <div class="gira">
        <div class="cara frente"><div class="recorte">${pintaCara(c)}</div></div>
        <div class="cara dorso"><div class="recorte"></div></div>
      </div>
    </div>`).join('');
  cartas = [...monton.querySelectorAll('.carta')];
  ajustaK();
  paso = -1;
  sobre.className = '';
  sobre.style.display = '';
  pista.textContent = 'Toca el sobre';
  pista.classList.add('on');
}

function rasgar() {
  if (paso > -1) return;
  paso = 0;
  pista.classList.remove('on');
  sobre.classList.add('toque');
  setTimeout(() => {
    sobre.classList.remove('toque');
    sobre.classList.add('abierto');
    // El montón asoma cuando la solapa ya se ha ido.
    setTimeout(() => {
      monton.classList.add('sale');
      // La última nace boca abajo: es la que puede ser la buena.
      cartas[cartas.length - 1].classList.add('bocabajo');
      setTimeout(() => { sobre.style.display = 'none'; siguiente(); }, 700);
    }, 260);
  }, 130);
}

function siguiente() {
  if (paso > 0) cartas[paso - 1].classList.add('vista');
  if (paso >= cartas.length) { fin(); return; }
  const c = cartas[paso];
  c.classList.add('mirando');
  const ultima = paso === cartas.length - 1;
  pista.textContent = ultima ? 'La última, boca abajo · tócala' : 'Toca para seguir';
  pista.classList.add('on');
  paso++;
  if (!ultima) reloj = setTimeout(siguiente, 1500);
}

function fin() {
  pista.textContent = 'Se acabó · "Otra vez" para repetir';
  pista.classList.add('on');
}

let reloj = null;
function toque() {
  if (paso === -1) { rasgar(); return; }
  clearTimeout(reloj);
  const ultima = cartas[cartas.length - 1];
  if (paso === cartas.length && ultima.classList.contains('bocabajo')) {
    ultima.classList.remove('bocabajo');           // la vuelta de la buena
    pista.textContent = '';
    setTimeout(fin, 700);
    return;
  }
  if (paso < cartas.length) siguiente();
}

addEventListener('pointerdown', e => { if (e.target.id !== 'otra') toque(); });
$('#otra').addEventListener('click', () => { clearTimeout(reloj); montar(); });
addEventListener('resize', ajustaK);
montar();
</script>
