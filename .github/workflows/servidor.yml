name: Servidor

# Publica el servidor de partidas en directo y deja su dirección METIDA DENTRO del APK,
# para que quien lo instale pueda jugar sin configurar absolutamente nada.
#
# Cadena completa, en una sola ejecución:
#   desplegar worker → escribir juego/servidor.js → construir APK → publicar descarga
#
# Los cuatro pasos van juntos a propósito: un commit hecho con GITHUB_TOKEN no dispara
# otros flujos (GitHub lo impide para evitar bucles), así que separar el despliegue de
# la construcción del APK rompería la cadena justo en medio.
#
# Necesita dos secretos del repositorio, que se ponen UNA vez:
#   CLOUDFLARE_API_TOKEN    (plantilla "Edit Cloudflare Workers")
#   CLOUDFLARE_ACCOUNT_ID
# Los pasos están en servidor/COMO-ACTIVARLO.md

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'claude/**'
    paths:
      - 'servidor/**'
      - 'juego/**'
      - 'android/**'
      - '.github/workflows/servidor.yml'

permissions:
  contents: write

jobs:
  desplegar:
    runs-on: ubuntu-latest
    outputs:
      listo:  ${{ steps.comp.outputs.listo }}
      url:    ${{ steps.deploy.outputs.url }}
      commit: ${{ steps.fijar.outputs.commit }}
    steps:
      - uses: actions/checkout@v4

      # Sin los secretos no se puede desplegar, pero tampoco tiene sentido dejar el flujo
      # en rojo cada vez que se toque un archivo: se explica qué falta y se sale bien.
      - name: Comprobar que están los secretos
        id: comp
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CUENTA: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$CUENTA" ]; then
            echo "listo=si" >> "$GITHUB_OUTPUT"
          else
            echo "listo=no" >> "$GITHUB_OUTPUT"
            {
              echo "## El servidor todavía no está activado"
              echo ""
              echo "No es un error: es que aún no se ha hecho la configuración inicial, que se hace una sola vez."
              echo ""
              [ -z "$TOKEN" ]  && echo "- Falta el secreto \`CLOUDFLARE_API_TOKEN\`"
              [ -z "$CUENTA" ] && echo "- Falta el secreto \`CLOUDFLARE_ACCOUNT_ID\`"
              echo ""
              echo "Los tres pasos están en **servidor/COMO-ACTIVARLO.md**."
              echo "Se añaden en **Settings → Secrets and variables → Actions → New repository secret**."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Preparar Node
        if: steps.comp.outputs.listo == 'si'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependencias del servidor
        if: steps.comp.outputs.listo == 'si'
        working-directory: servidor
        run: npm install --no-audit --no-fund

      # Se despliega desde servidor/ con el repositorio entero clonado: el worker importa
      # ../../juego/motor.js a propósito, para que servidor y juego compartan exactamente
      # el mismo reglamento y no puedan divergir.
      - name: Publicar el servidor
        if: steps.comp.outputs.listo == 'si'
        id: deploy
        working-directory: servidor
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          npx wrangler deploy 2>&1 | tee despliegue.txt
          URL=$(grep -Eoi 'https://[a-z0-9.-]+\.workers\.dev' despliegue.txt | head -1)
          if [ -z "$URL" ]; then
            echo "No se ha podido leer la dirección de la salida de wrangler." >&2
            exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          rm -f despliegue.txt

      # Que el despliegue termine en verde solo dice que el archivo se subió. Esto abre
      # dos clientes contra la dirección publicada y juega una partida entera. Si falla,
      # el APK no se publica: más vale no publicar que publicar algo roto.
      # Las salas son Durable Objects vivos: al desplegar tardan unos segundos en
      # reiniciarse con el código nuevo. Probar al instante puede estar probando
      # todavía la versión anterior, y entonces el resultado no dice nada.
      - name: Probar el servidor recién desplegado
        if: steps.comp.outputs.listo == 'si'
        run: |
          sleep 20
          node servidor/prueba-en-vivo.mjs "${{ steps.deploy.outputs.url }}"

      # Aquí está la gracia: la dirección se mete en el juego, así que el APK que se
      # construya después ya la lleva dentro y nadie tiene que pegarla a mano.
      - name: Meter la dirección en el juego
        if: steps.comp.outputs.listo == 'si'
        id: fijar
        run: |
          cat > juego/servidor.js <<ARCHIVO
          /* Dirección del servidor de partidas en directo.

             ESTE ARCHIVO LO ESCRIBE SOLO EL FLUJO "Servidor" DE GITHUB ACTIONS al desplegar.
             No hace falta tocarlo a mano. */

          window.SERVIDOR_POR_DEFECTO = "${{ steps.deploy.outputs.url }}";
          ARCHIVO
          if git diff --quiet -- juego/servidor.js; then
            echo "cambio=no" >> "$GITHUB_OUTPUT"
            echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          else
            echo "cambio=si" >> "$GITHUB_OUTPUT"
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add juego/servidor.js
            git commit -m "Point the game at the deployed live-match server"
            git push origin HEAD:${{ github.ref_name }}
            echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Preparar Java
        if: steps.comp.outputs.listo == 'si'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        if: steps.comp.outputs.listo == 'si'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Construir el APK con la dirección dentro
        if: steps.comp.outputs.listo == 'si'
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Guardar el APK para la publicación
        if: steps.comp.outputs.listo == 'si'
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: android/app/build/outputs/apk/debug/app-debug.apk

  # ── iPhone ──────────────────────────────────────────────────────────────────
  # En un runner de macOS, que es el único sitio donde existe Xcode. Sale SIN FIRMAR:
  # firmar exige un certificado de una cuenta de desarrollador de Apple, que es del
  # dueño y no puede vivir en el repositorio. Se instala con Sideloadly o AltStore.
  # Los detalles están en ios/COMO-FUNCIONA.md.
  iphone:
    needs: desplegar
    if: needs.desplegar.outputs.listo == 'si'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.desplegar.outputs.commit }}

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Meter el juego dentro de la aplicación
        run: |
          mkdir -p ios/juego-assets
          cp juego/juego.html juego/motor.js juego/roster.js juego/servidor.js ios/juego-assets/
          test -s ios/juego-assets/servidor.js

      - name: Generar el proyecto de Xcode
        working-directory: ios
        run: xcodegen generate

      - name: Construir el .ipa
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project JaulaAbierta.xcodeproj -scheme JaulaAbierta \
            -configuration Release -sdk iphoneos -derivedDataPath build \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            build | xcpretty || xcodebuild -project JaulaAbierta.xcodeproj -scheme JaulaAbierta \
            -configuration Release -sdk iphoneos -derivedDataPath build \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO build
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/JaulaAbierta.app Payload/
          zip -qry jaula-abierta.ipa Payload
          ls -l jaula-abierta.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: ios/jaula-abierta.ipa

  # ── La descarga, con las dos ────────────────────────────────────────────────
  publicar:
    needs: [desplegar, iphone]
    if: always() && needs.desplegar.outputs.listo == 'si'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: descargas
      - name: Publicar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          URL: ${{ needs.desplegar.outputs.url }}
        run: |
          mkdir -p salida
          cp descargas/android/app-debug.apk salida/jaula-abierta.apk
          # Si la de iPhone ha fallado no se cancela la publicación: el APK sigue
          # sirviendo, y quedarse sin descarga por eso sería peor.
          if [ -f descargas/ios/jaula-abierta.ipa ]; then
            cp descargas/ios/jaula-abierta.ipa salida/
            IPA="listo"
          else
            IPA="no ha salido en esta vuelta"
          fi
          {
            echo "Prototipo jugable, Android e iPhone."
            echo ""
            echo "**Android** — descarga \`jaula-abierta.apk\` y ábrelo. Nada que configurar."
            echo ""
            echo "**iPhone** — \`jaula-abierta.ipa\` ($IPA) va **sin firmar**: Apple no deja"
            echo "instalarlo tocándolo. Se instala desde un ordenador con Sideloadly o AltStore,"
            echo "firmándolo con tu propio Apple ID. Con cuenta gratuita caduca a los 7 días."
            echo "Está explicado en \`ios/COMO-FUNCIONA.md\`."
            echo ""
            echo "Las partidas en directo vienen ya configuradas en las dos."
            echo "Servidor: $URL"
          } > notas.md
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest salida/* \
            --title "Jaula Abierta — versión de prueba" \
            --notes-file notas.md \
            --prerelease

      - name: Resumen
        env:
          URL: ${{ needs.desplegar.outputs.url }}
        run: |
          {
            echo "# Listo"
            echo ""
            echo "Servidor publicado en \`$URL\` y comprobado con dos clientes jugando una partida entera."
            echo ""
            echo "Descargas en la publicación **apk-latest**: APK de Android e .ipa de iPhone,"
            echo "las dos con la dirección del servidor ya dentro."
          } >> "$GITHUB_STEP_SUMMARY"
