name: APK

# Comprueba que el APK de Android sigue construyendo, y lo deja como artefacto de la
# ejecución. Se hace aquí y no en local porque el SDK de Android y el plugin de Gradle
# se descargan de dl.google.com, que el entorno de desarrollo tiene bloqueado. Los
# runners de GitHub ya traen el SDK instalado.
#
# NO publica la descarga apk-latest. De eso se encarga el flujo "Servidor", que
# construye el mismo APK pero con la dirección del servidor ya dentro, y que publica
# el APK y el .ipa juntos. Si publicaran los dos, se pisarían: los dos borran y
# vuelven a crear la misma publicación en el mismo empujón, y quien acabara el último
# se quedaría con ella. Estuvo pasando: durante minuto y medio de cada despliegue la
# descarga se quedaba sin el .ipa, y bastaba con que el runner de macOS fuera un poco
# más rápido para que se quedara sin él del todo.

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'claude/**'
    paths:
      - 'juego/**'
      - 'android/**'
      - '.github/workflows/apk.yml'

permissions:
  contents: read

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Construir el APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Renombrar
        run: |
          mkdir -p salida
          cp android/app/build/outputs/apk/debug/app-debug.apk salida/jaula-abierta.apk
          ls -lh salida/

      - name: Guardar como artefacto de la ejecución
        uses: actions/upload-artifact@v4
        with:
          name: jaula-abierta-apk
          path: salida/jaula-abierta.apk
          if-no-files-found: error
