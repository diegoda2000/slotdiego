<style>
/* ═══════════════════════════════════════════════════════════════

:root{

body{background:var(--bg);color:var(--txt);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;

/* ── varios ── */

  max-width:420px;width:100%;max-height:92vh;overflow-y:auto}

<script>
"use strict";
/* ══════════════════════════════════════════════════════════════════════════
   1. DATOS BASE
   ══════════════════════════════════════════════════════════════════════════ */

const DIVISIONES = [
  {id:'m0',n:'Mosca',      g:'M',o:0}, {id:'m1',n:'Gallo',      g:'M',o:1},
  {id:'m2',n:'Pluma',      g:'M',o:2}, {id:'m3',n:'Ligero',     g:'M',o:3},
  {id:'m4',n:'Wélter',     g:'M',o:4}, {id:'m5',n:'Medio',      g:'M',o:5},
  {id:'m6',n:'Semipesado', g:'M',o:6}, {id:'m7',n:'Pesado',     g:'M',o:7},
  {id:'f0',n:'Paja F',     g:'F',o:0}, {id:'f1',n:'Mosca F',    g:'F',o:1},
  {id:'f2',n:'Gallo F',    g:'F',o:2},
];
const DIV = Object.fromEntries(DIVISIONES.map(d=>[d.id,d]));

// Dos escaleras independientes: no hay puente entre géneros.
function contiguas(a,b){ const x=DIV[a],y=DIV[b]; return x.g===y.g && Math.abs(x.o-y.o)===1; }
function vecinas(id){ return DIVISIONES.filter(d=>contiguas(id,d.id)).map(d=>d.id); }

const STATS = [
  {id:'golpeo',n:'GOLPEO',c:'GLP'}, {id:'lucha',n:'LUCHA',c:'LCH'},
  {id:'suelo', n:'SUELO', c:'SUE'}, {id:'cardio',n:'CARDIO',c:'CAR'},
  {id:'dureza',n:'DUREZA',c:'DUR'}, {id:'iq',    n:'IQ',    c:'IQ'},
];
const SID = STATS.map(s=>s.id);

// Sub-stats exactamente como el GDD §2.2. La stat visible es su media.
const SUBSTATS = {
  golpeo:['potencia','precisión','volumen','boxeo','patadas','golpeo en clinch'],
  lucha :['derribos','defensa de derribo','clinch','control contra la jaula','levantarse','transiciones'],
  suelo :['sumisiones','defensa de sumisión','control desde arriba','guardia','ground and pound','escapes'],
  cardio:['resistencia','recuperación','ritmo sostenido','asaltos finales','eficiencia de movimiento','gestión del gas'],
  dureza:['mentón','absorción de daño','resistencia a cortes','recuperación de aturdimiento','castigo corporal','voluntad'],
  iq    :['lectura del rival','gestión de distancia','adaptación','control del octógono','defensa','gestión de asaltos'],
};

const RAREZAS = {
  bronce  :{n:'Bronce',   min:55,max:68,fichas:1/20},
  plata   :{n:'Plata',    min:65,max:78,fichas:1/5},
  oro     :{n:'Oro',      min:75,max:88,fichas:1},
  elite   :{n:'Élite',    min:85,max:95,fichas:3},
  leyenda :{n:'Leyenda',  min:96,max:99,fichas:8},
};
const ORDEN_RAREZA = ['bronce','plata','oro','elite','leyenda'];

// Arquetipos: sesgos por stat. Base de la autoría — el resto es ruido.
const ARQUETIPOS = [
  {n:'Striker de distancia', o:{golpeo:+9,lucha:-6,suelo:-7,cardio:+1,dureza:-1,iq:+4}},
  {n:'Boxeador de presión',  o:{golpeo:+8,lucha:+1,suelo:-8,cardio:+3,dureza:+4,iq:-3}},
  {n:'Luchador de control',  o:{golpeo:-6,lucha:+10,suelo:+6,cardio:+3,dureza:+2,iq:+1}},
  {n:'Grappler agresivo',    o:{golpeo:-8,lucha:+7,suelo:+11,cardio:-1,dureza:-2,iq:+2}},
  {n:'Sumisionista',         o:{golpeo:-9,lucha:+3,suelo:+12,cardio:-2,dureza:-1,iq:+4}},
  {n:'Peleador completo',    o:{golpeo:+2,lucha:+2,suelo:+2,cardio:+2,dureza:+1,iq:+3}},
  {n:'Guerrero de desgaste', o:{golpeo:0, lucha:+1,suelo:-2,cardio:+10,dureza:+9,iq:-4}},
  {n:'Noqueador',            o:{golpeo:+12,lucha:-3,suelo:-9,cardio:-6,dureza:+3,iq:-3}},
  {n:'Contragolpeador',      o:{golpeo:+5,lucha:-4,suelo:-4,cardio:+2,dureza:0, iq:+9}},
  {n:'Wrestleboxer',         o:{golpeo:+5,lucha:+7,suelo:0, cardio:+1,dureza:+1,iq:+2}},
];

const RASGOS = {
  camaleon   :{n:'Camaleón',   ic:'🦎', d:'Al declarar, manda esta carta a pelear a una división contigua sin penalización. Tu carta de esa división se descarta sin pelear y el Camaleón sigue disponible para su propio duelo.', dplus:'Igual, pero no consume tu jugada.'},
  incomodo   :{n:'Incómodo',   ic:'🌀', d:'Ocultas la división. El rival ve dos cartas suyas (la real y una contigua) y elige a ciegas. Si falla, su carta come -6.', dplus:'La segunda carta es de cualquier división en juego y el fallo cuesta -12. Usable siempre.'},
  especialista:{n:'Especialista',ic:'🎯',d:'Si gana su duelo en su stat, esa stat no se gasta del pool.', dplus:'La stat no se gasta aunque pierda.'},
  veterano   :{n:'Veterano',   ic:'🧠', d:'Cuando el rival declara la stat, la cambias por una aleatoria de entre las vivas.', dplus:'La eliges tú.'},
};

const PROMOTORAS = [
  {id:'liga', n:'Liga Mayor', alineable:true},
  {id:'cw',   n:'Circuito Norte',  alineable:false},
  {id:'ksw',  n:'Arena del Este',  alineable:false},
  {id:'rzn',  n:'Torneo Oriental', alineable:false},
  {id:'inv',  n:'Liga Invicta',    alineable:false},
];

const GIMNASIOS = ['Casa Negra','Hierro Viejo','Escuela Delta','Jaula 9','Templo Rojo','Nordeste MMA',
  'Alto Valle','Puño de Piedra','Academia Marea','Cuartel Sur','Bunker 12','Halcón Blanco'];
const PAISES = ['🇧🇷 Brasil','🇺🇸 EE.UU.','🇷🇺 Rusia','🇲🇽 México','🇮🇪 Irlanda','🇳🇬 Nigeria','🇯🇵 Japón',
  '🇵🇱 Polonia','🇰🇷 Corea','🇦🇺 Australia','🇫🇷 Francia','🇬🇧 Reino Unido','🇦🇷 Argentina','🇨🇳 China'];

const NOM_M = ['Dario','Kervin','Oleg','Tadeo','Mattis','Rulon','Ivo','Sabas','Nuno','Kaleb','Ronin','Elian',
 'Zoran','Bruno','Anselmo','Yuri','Iker','Marek','Teo','Casio','Adib','Renzo','Lubo','Ander','Tibor','Nael',
 'Osmar','Dimas','Vlado','Emeka','Hiro','Kwame','Silas','Roco','Jarek','Amiel','Nestor','Ciro','Baltasar','Vasco'];
const NOM_F = ['Nira','Talia','Yuna','Reka','Ilse','Mara','Zoe','Ainhoa','Kaia','Ludmila','Iria','Sena',
 'Vania','Runa','Amaia','Petra','Noor','Kira','Elsa','Tania','Maren','Ísis','Nadia','Lía','Frida','Ondina'];
const APE = ['Varga','Okonkwo','Mestre','Duarte','Kovac','Ferreiro','Nakamura','Bielski','Sandoval','Moreau',
 'Ibarra','Krylov','Tanaka','Oduya','Salgado','Vranic','Cabral','Nikolic','Estévez','Rahal','Bjorn','Cassano',
 'Petrov','Aguirre','Moss','Delacroix','Farkas','Quiroga','Nurgaliev','Owusu','Vidal','Strand','Barros','Melnyk',
 'Ozaki','Ferrán','Lombardi','Haddad','Rojas','Kirilenko','Bouchard','Nunes do Vale','Ashworth','Tovar'];
const APODOS = ['el Cirujano','Mano de Hierro','el Silencioso','Tormenta','el Reloj','Diente de Sable',
 'el Contable','Media Noche','el Ancla','Rayo Seco','el Profesor','Bisturí','el Náufrago','Cabeza Fría',
 'el Martillo','Viento Negro','el Cuervo','Piedra','el Relámpago','Corazón Frío','la Guillotina','el Sismo',
 'Mandíbula','el Verdugo','Aguja','Hueso Duro','el Fantasma','Perro Viejo','la Marea','Dos Caras'];

/* ══════════════════════════════════════════════════════════════════════════
   2. AZAR CON SEMILLA
   ══════════════════════════════════════════════════════════════════════════ */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let RNG = Math.random;
const ri=(a,b)=>a+Math.floor(RNG()*(b-a+1));
const pick=a=>a[Math.floor(RNG()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(RNG()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

/* ══════════════════════════════════════════════════════════════════════════
   3. GENERACIÓN DEL ROSTER  (semilla fija: el catálogo es siempre el mismo)
   ══════════════════════════════════════════════════════════════════════════ */
let ROSTER=[], PORID={};

function generarCarta(id,divId,rareza,promo,opts={}){
  const d=DIV[divId], fem=d.g==='F';
  const arq=pick(ARQUETIPOS);
  const R=RAREZAS[rareza];
  const objetivo=ri(R.min,R.max);
  const persona=opts.persona||{
    nombre:(fem?pick(NOM_F):pick(NOM_M))+' '+pick(APE),
    apodo: RNG()<.55?pick(APODOS):'',
    pais:pick(PAISES), gimnasio:pick(GIMNASIOS),
    veterano:RNG()<.28,
  };
  const stats={}, subs={};
  for(const s of SID){
    const t=clamp(objetivo+(arq.o[s]||0)+ri(-4,4),38,99);
    if(promo.alineable){
      // Las alineables llevan las 6 sub-stats; la grande es su media (GDD §2.2)
      const v=SUBSTATS[s].map(()=>clamp(t+ri(-7,7),35,99));
      subs[s]=v; stats[s]=Math.round(v.reduce((a,b)=>a+b,0)/v.length);
    }else{
      // Las de colección no son alineables: solo las 6 grandes (propuesta del plan)
      stats[s]=t;
    }
  }
  // El sesgo del arquetipo desplaza la media fuera de su banda de rareza. Se corrige
  // desplazando todo el bloque hasta el objetivo: mantiene la forma del arquetipo y
  // deja la media dentro del rango, que es lo que hace funcionar la tabla de márgenes.
  let media=Math.round(SID.reduce((a,s)=>a+stats[s],0)/6);
  const delta=objetivo-media;
  if(delta){
    for(const s of SID){
      if(subs[s]){
        subs[s]=subs[s].map(v=>clamp(v+delta,35,99));
        stats[s]=Math.round(subs[s].reduce((a,b)=>a+b,0)/subs[s].length);
      }else stats[s]=clamp(stats[s]+delta,35,99);
    }
    media=Math.round(SID.reduce((a,s)=>a+stats[s],0)/6);
  }
  return {id,persona:opts.personaId||id,nombre:persona.nombre,apodo:persona.apodo,
    pais:persona.pais,gimnasio:persona.gimnasio,esVeterano:persona.veterano,
    division:divId,rareza,media,stats,subs:promo.alineable?subs:null,
    promotora:promo.id,alineable:promo.alineable,arquetipo:arq.n,
    dobleDiv:!!opts.dobleDiv,rasgos:[],notraspasable:false};
}

function asignarRasgos(c){
  const p={bronce:.02,plata:.08,oro:.26,elite:.62,leyenda:.9}[c.rareza];
  if(RNG()>p) return;
  const posibles=['incomodo','especialista'];
  if(c.dobleDiv) posibles.push('camaleon');
  if(c.esVeterano) posibles.push('veterano');
  const n=(RNG()<.07 && posibles.length>1)?2:1;   // dos rasgos: rarísimo
  const elegidos=shuffle(posibles).slice(0,n);    // siempre distintos entre sí
  for(const t of elegidos){
    const r={tipo:t,plus:RNG()<.2};
    if(t==='especialista'){
      // asociado a su mejor stat
      r.stat=SID.slice().sort((a,b)=>c.stats[b]-c.stats[a])[0];
    }
    c.rasgos.push(r);
  }
}

function generarRoster(){
  RNG=mulberry32(20260816);
  const out=[]; let n=0;
  const liga=PROMOTORAS[0];
  for(const d of DIVISIONES){
    const reparto=[...Array(6).fill('bronce'),...Array(4).fill('plata'),...Array(3).fill('oro'),'elite'];
    for(const rar of reparto) out.push(generarCarta('c'+(n++),d.id,rar,liga));
  }
  // 5 leyendas en todo el juego (GDD §2.4: "por encima de 95, 4-5 cartas")
  for(const dId of shuffle(DIVISIONES.map(d=>d.id)).slice(0,5))
    out.push(generarCarta('c'+(n++),dId,'leyenda',liga));

  // Peleadores con historial en dos divisiones → candidatos a Camaleón.
  // Comparten persona: no puedes alinear las dos versiones a la vez.
  const gemelas=[];
  for(const c of out){
    if(c.rareza==='bronce'||RNG()>.14) continue;
    const v=vecinas(c.division); if(!v.length) continue;
    const g=generarCarta('c'+(n++),pick(v),c.rareza,liga,{
      persona:{nombre:c.nombre,apodo:c.apodo,pais:c.pais,gimnasio:c.gimnasio,veterano:c.esVeterano},
      personaId:c.persona,dobleDiv:true});
    c.dobleDiv=true; gemelas.push(g);
  }
  out.push(...gemelas);

  // Cartas de colección de otras promotoras: no alineables
  for(const p of PROMOTORAS.slice(1)){
    for(let i=0;i<11;i++){
      const rar=['bronce','bronce','bronce','plata','plata','oro','oro','elite'][ri(0,7)];
      out.push(generarCarta('c'+(n++),pick(DIVISIONES).id,rar,p));

  }
  for(const c of out) asignarRasgos(c);
  ROSTER=out; PORID=Object.fromEntries(out.map(c=>[c.id,c]));
  RNG=Math.random;
}

function estadoNuevo(){

  const conRasgo=alineables().filter(c=>c.rasgos.length===1&&!c.rasgos[0].plus)
    .sort((a,b)=>a.media-b.media);            // la más floja que cumpla: es una herramienta, no un regalo
  if(conRasgo.length) s.coleccion.push({iid:'i-start',cid:conRasgo[0].id,notraspasable:true});
  s.sobres=[{tipo:'basico'},{tipo:'basico'},{tipo:'oro'}];
  autoPlantilla(s);
  return s;
}
function autoPlantilla(s){
  for(const d of DIVISIONES){
    if(s.plantilla[d.id]) continue;
    const cands=s.coleccion.filter(x=>{const c=PORID[x.cid];return c.alineable&&c.division===d.id});
    if(!cands.length) continue;
    cands.sort((a,b)=>PORID[b.cid].media-PORID[a.cid].media);
    for(const cd of cands){ if(!personaRepetida(s,cd,d.id)){ s.plantilla[d.id]=cd.iid; break; } }
  }
}
function personaRepetida(s,cardInst,divId){
  const per=PORID[cardInst.cid].persona;
  return Object.entries(s.plantilla).some(([dv,iid])=>{
    if(dv===divId) return false;
    const o=s.coleccion.find(x=>x.iid===iid);
    return o && PORID[o.cid].persona===per;
  });
}

// acumular veinte y abrirlos de golpe es el momento que engancha (GDD §9).
// El de menos espera tiene el drop más bajo, como pide el GDD.
const GRATIS=[
  {id:'g1', tipo:'basico', espera:      3*60000},
  {id:'g2', tipo:'plata',  espera:     20*60000},

function reloj(ms){
  const s=Math.ceil(ms/1000), h=Math.floor(s/3600), m=Math.floor(s%3600/60), r=s%60;
  return h?`${h}:${String(m).padStart(2,'0')}:${String(r).padStart(2,'0')}`
          :`${m}:${String(r).padStart(2,'0')}`;
}
function sorteaRareza(pesos){
  const tot=Object.values(pesos).reduce((a,b)=>a+b,0); let r=Math.random()*tot;
  for(const [k,v] of Object.entries(pesos)){ if((r-=v)<0) return k; }
  return 'bronce';
}
// Un solo tipo de sobre con huecos alineables garantizados + huecos de colección
// de regalo (propuesta del plan para "el sobre que decepciona").
function abrirSobre(tipo){
  const T=TIPOS_SOBRE[tipo], salida=[];
  for(let i=0;i<T.cartas;i++){
    const soloAlineables=i<T.alineables;
    const rar=sorteaRareza(T.pesos);
    let pool=ROSTER.filter(c=>c.rareza===rar&&c.alineable===soloAlineables);
    if(!pool.length) pool=ROSTER.filter(c=>c.alineable===soloAlineables);
    const c=pick(pool);
    const it={iid:'i'+Math.random().toString(36).slice(2,9),cid:c.id};
    S.coleccion.push(it); salida.push(it);
  }
  guardar(); return salida;
}
function reciclar(iids){
  let fr=0;
  for(const iid of iids){
    const it=inst(iid); if(!it) continue;
    if(Object.values(S.plantilla).includes(iid)) continue;
    fr+=RAREZAS[PORID[it.cid].rareza].fichas;
    S.coleccion=S.coleccion.filter(x=>x.iid!==iid);
  }
  const g=Math.floor(fr); S.fichas+=g; guardar(); return g;
}

const MARGENES={finish:13,decision:7};

function nuevaPartida(plantillaJ,plantillaR){
  return {fase:'rol', rolJ:null, vetoPrimero:null, vetados:[], vetoAzar:null,
    enJuego:[], jugadas:[], statsVivas:SID.slice(), duelo:0, turno:null,
    marcador:{j:0,r:0}, jugada:{j:false,r:false},
    cartas:{j:{...plantillaJ},r:{...plantillaR}}, // divId -> carta
    ajustes:{j:{},r:{}},  // divId -> {stat:delta}
    log:[], pendiente:null, fin:null};
}

function terminarVetos(P){
  P.enJuego=DIVISIONES.map(d=>d.id).filter(id=>!P.vetados.includes(id));
  // Veto aleatorio al final: su división será el desempate
  P.vetoAzar=pick(P.enJuego);
  P.enJuego=P.enJuego.filter(id=>id!==P.vetoAzar);
  P.enJuego.sort((a,b)=>DIVISIONES.findIndex(d=>d.id===a)-DIVISIONES.findIndex(d=>d.id===b));
  P.fase='duelos'; P.duelo=1;
  P.turno=P.vetoPrimero==='j'?'r':'j';   // empieza declarando el que no empezó vetando
  P.log.push({t:'sys',x:`Veto aleatorio: ${DIV[P.vetoAzar].n} — será el desempate.`});
}

const librePara=(P,l)=>P.enJuego.filter(id=>!P.jugadas.includes(id));
function valorCarta(P,l,divId,stat){
  const c=P.cartas[l][divId]; if(!c) return 0;
  const a=(P.ajustes[l][divId]||{})[stat]||0;
  return c.stats[stat]+a;
}
function aplicarPenalizacion(P,l,divId,tipo){
  const a=P.ajustes[l][divId]||(P.ajustes[l][divId]={});
  const lista=tipo==='subir'?['golpeo','lucha','dureza']:['cardio','dureza'];
  for(const s of lista) a[s]=(a[s]||0)-6;
}
function penaliza(P,l,divId,stats,v){
  const a=P.ajustes[l][divId]||(P.ajustes[l][divId]={});
  for(const s of stats) a[s]=(a[s]||0)+v;
}
// Las dos cartas cambian de slot llevándose sus ajustes. Lo usa el Incómodo:
// así el peleador enviado pelea en la división declarada y el otro cubre la que deja,
// de modo que cada peleador sigue peleando una sola vez y el calendario cuadra.
function intercambiarSlots(P,l,a,b){
  const ca=P.cartas[l][a], cb=P.cartas[l][b];
  P.cartas[l][a]=cb; P.cartas[l][b]=ca;
  const aa=P.ajustes[l][a]||{}, ab=P.ajustes[l][b]||{};
  P.ajustes[l][a]=ab; P.ajustes[l][b]=aa;
}

// Cambio de división: contiguas, ambas en juego, ninguna jugada, intercambio obligado
function cambiosPosibles(P,l){
  if(P.jugada[l]) return [];
  const libres=librePara(P,l), out=[];
  for(const a of libres) for(const b of libres)
    if(a<b && contiguas(a,b)) out.push([a,b]);
  return out;
}
function hacerCambio(P,l,a,b){
  const A=DIV[a],B=DIV[b];
  const [abajo,arriba]=A.o<B.o?[a,b]:[b,a];
  const cAbajo=P.cartas[l][abajo], cArriba=P.cartas[l][arriba];
  P.cartas[l][arriba]=cAbajo; P.cartas[l][abajo]=cArriba;
  P.ajustes[l][arriba]={}; P.ajustes[l][abajo]={};
  aplicarPenalizacion(P,l,arriba,'subir');   // la que sube
  aplicarPenalizacion(P,l,abajo,'bajar');    // la que baja
  P.jugada[l]=true;
  P.log.push({t:'sys',x:`${l==='j'?'Tú':'El rival'}: cambio de división ${DIV[abajo].n} ⇄ ${DIV[arriba].n}.`});
}

function rasgoDe(c,tipo){ return c?c.rasgos.find(r=>r.tipo===tipo):null; }

// Camaleón: manda la carta a una contigua sin penalización; la de allí se descarta.
function camaleonesPosibles(P,l,divDeclarada){
  const out=[];
  for(const dId of librePara(P,l)){
    if(dId===divDeclarada) continue;
    const c=P.cartas[l][dId]; const r=rasgoDe(c,'camaleon');
    if(r && contiguas(dId,divDeclarada) && (!P.jugada[l]||r.plus)) out.push({div:dId,carta:c,rasgo:r});
  }
  return out;
}

function resolverDuelo(P,divId,stat,opts={}){
  const vj=valorCarta(P,'j',divId,stat), vr=valorCarta(P,'r',divId,stat);
  const m=Math.abs(vj-vr);
  let ganador, tipo;
  if(m===0){ ganador=Math.random()<.5?'j':'r'; tipo='reñido'; }         // empate: moneda al aire
  else{
    const alto=vj>vr?'j':'r';
    if(m>=MARGENES.finish){ ganador=alto; tipo='finish'; }
    else if(m>=MARGENES.decision){ ganador=alto; tipo='decisión'; }
    else { ganador=Math.random()<.65?alto:(alto==='j'?'r':'j'); tipo='reñido'; }
  }
  P.marcador[ganador]++;
  const cj=P.cartas.j[divId], cr=P.cartas.r[divId];
  P.log.push({t:'duelo',div:divId,stat,vj,vr,ganador,tipo,
    nj:cj?cj.nombre:'—',nr:cr?cr.nombre:'—',
    dobleJ:!!opts.dobleJ,dobleR:!!opts.dobleR});

  // ESPECIALISTA: la stat puede no gastarse (revive para los dos)
  let revive=false;
  for(const l of ['j','r']){
    const c=P.cartas[l][divId]; const r=rasgoDe(c,'especialista');
    if(r && r.stat===stat && (r.plus || ganador===l)) revive=true;
  }
  if(!revive) P.statsVivas=P.statsVivas.filter(s=>s!==stat);
  else P.log.push({t:'sys',x:`Especialista: ${stat.toUpperCase()} no se gasta y vuelve al pool.`});

  P.jugadas.push(divId);
  if(P.marcador.j>=4||P.marcador.r>=4){ P.fase='fin'; P.fin=P.marcador.j>=4?'j':'r'; return; }
  if(P.jugadas.length>=P.enJuego.length){
    if(P.marcador.j===P.marcador.r){ P.fase='desempate'; }
    else { P.fase='fin'; P.fin=P.marcador.j>P.marcador.r?'j':'r'; }
    return;
  }
  P.duelo++;
  P.turno=P.turno==='j'?'r':'j';
}

function resolverDesempate(P){
  const divId=P.vetoAzar, stat=pick(SID);   // azar solo donde ya no quedan decisiones
  const vj=valorCarta(P,'j',divId,stat), vr=valorCarta(P,'r',divId,stat);
  let ganador;
  const m=Math.abs(vj-vr);
  if(m===0) ganador=Math.random()<.5?'j':'r';
  else{ const alto=vj>vr?'j':'r'; ganador=(m>=MARGENES.decision)?alto:(Math.random()<.65?alto:(alto==='j'?'r':'j')); }
  P.marcador[ganador]++;
  P.log.push({t:'duelo',div:divId,stat,vj,vr,ganador,tipo:'desempate',
    nj:P.cartas.j[divId].nombre,nr:P.cartas.r[divId].nombre});
  P.fase='fin'; P.fin=ganador;
}

function plantillaIA(mediaObjetivo){
  const out={}, personas=new Set();
  for(const d of DIVISIONES){
    const pool=alineables().filter(c=>c.division===d.id&&!personas.has(c.persona));
    pool.sort((a,b)=>Math.abs(a.media-mediaObjetivo)-Math.abs(b.media-mediaObjetivo));
    const c=pool[ri(0,Math.min(4,pool.length-1))];
    out[d.id]=c; personas.add(c.persona);   // un peleador, un slot
  }
  return out;
}
function iaVeta(P){
  const libres=DIVISIONES.map(d=>d.id).filter(id=>!P.vetados.includes(id));
  // veta donde su carta es peor
  libres.sort((a,b)=>P.cartas.r[a].media-P.cartas.r[b].media);
  return libres[0];
}
function iaDeclara(P){
  const libres=librePara(P,'r');
  let mejor=null;
  for(const d of libres) for(const s of P.statsVivas){
    // sin conocer las cartas del rival, valora su propia fuerza en esa casilla
    const v=valorCarta(P,'r',d,s);
    const bonus=(P.cartas.r[d].stats[s]>=85?6:0);
    const sc=v+bonus+Math.random()*4;
    if(!mejor||sc>mejor.sc) mejor={div:d,stat:s,sc};
  }
  return mejor;
}
function iaJugada(P){
  // usa el cambio de división si le mejora claramente la casilla más floja
  if(P.jugada.r||Math.random()<.45) return null;
  const ops=cambiosPosibles(P,'r');
  if(!ops.length) return null;
  return Math.random()<.5?pick(ops):null;
}
function iaEligeIncomodo(P,opciones){ return pick(opciones); }

// Los relojes se refrescan solos sin volver a pintar la pantalla entera:
// un render completo cada segundo se comería los toques del jugador.
function actualizarRelojes(){
  for(const g of GRATIS){
    const b=document.querySelector(`[data-reloj="${g.id}"]`);
    if(!b) continue;
    const ok=listoGratis(g);
    b.textContent=ok?'Reclamar':reloj(restaGratis(g));
    b.disabled=!ok;
    const panel=b.closest('.card-panel');
    if(panel) panel.style.borderColor=ok?'var(--acc)':'';
  }
  const listos=nGratisListos();
  if(actualizarRelojes.ultimo===undefined) actualizarRelojes.ultimo=listos;
  if(listos!==actualizarRelojes.ultimo){    // acaba de caducar un reloj: repinta
    actualizarRelojes.ultimo=listos; render(); return;
  }
  const badge=document.querySelector('#nav .badge');
  const n=S.sobres.length+listos;
  if(badge && badge.textContent!==String(n)) badge.textContent=n;
}

function elegirRol(r){
  const iaQuiere=Math.random()<.5?'vetar':'declarar';
  let msg='';
  if(r!==iaQuiere){ P.rolJ=r; msg=`El rival eligió ${iaQuiere}. Cada uno a lo suyo.`; }
  else{
    const dj=ri(1,6),dr=ri(1,6);
    if(dj>=dr){ P.rolJ=r; msg=`Los dos queríais ${r}. Dado ${dj} a ${dr}: te lo quedas.`; }
    else{ P.rolJ=r==='vetar'?'declarar':'vetar'; msg=`Los dos queríais ${r}. Dado ${dj} a ${dr}: se lo queda el rival.`; }
  }
  P.vetoPrimero=P.rolJ==='vetar'?'j':'r';
  P.log.push({t:'sys',x:msg});
  P.fase='vetos';
  render();
  if(P.vetoPrimero==='r') setTimeout(turnoIAVeto,550);
}
function vetar(divId){
  P.vetados.push(divId);
  P.log.push({t:'sys',x:`Vetas ${DIV[divId].n}.`});
  if(P.vetados.length>=4){ terminarVetos(P); render(); return; }
  render(); setTimeout(turnoIAVeto,500);
}
function turnoIAVeto(){
  if(P.vetados.length>=4) return;
  const turnoJ=(P.vetados.length%2===0)===(P.vetoPrimero==='j');
  if(turnoJ) return;
  const v=iaVeta(P); P.vetados.push(v);
  P.log.push({t:'sys',x:`El rival veta ${DIV[v].n}.`});
  if(P.vetados.length>=4){ terminarVetos(P); render(); return; }
  render();
  const sigueJ=(P.vetados.length%2===0)===(P.vetoPrimero==='j');
  if(!sigueJ) setTimeout(turnoIAVeto,500);
}

// El VETERANO del defensor puede cambiar la stat declarada
function aplicarVeterano(P,defensor,divId,stat){
  const c=P.cartas[defensor][divId]; const r=rasgoDe(c,'veterano');
  if(!r || P.jugada[defensor]) return stat;
  const otras=P.statsVivas.filter(s=>s!==stat);
  if(otras.length<1) return stat;                    // condición real: ≥2 stats vivas
  if(defensor==='r'){
    if(Math.random()<.55) return stat;
    const nueva=r.plus?otras.sort((a,b)=>valorCarta(P,'r',divId,b)-valorCarta(P,'r',divId,a))[0]:pick(otras);
    P.jugada.r=true;
    P.log.push({t:'sys',x:`🧠 Veterano del rival: la stat pasa de ${stat.toUpperCase()} a ${nueva.toUpperCase()}.`});
    return nueva;
  }
  return stat;
}

function declarar(divId,stat,extra={}){
  let opts={};
  // Camaleón del jugador
  if(extra.camaleon){
    const cam=extra.camaleon;
    P.cartas.j[divId]=cam.carta;               // pelea aquí, sin penalización
    P.ajustes.j[divId]={};
    if(!cam.rasgo.plus) P.jugada.j=true;
    P.log.push({t:'sys',x:`🦎 Camaleón: ${cam.carta.nombre} sube desde ${DIV[cam.div].n}. Tu carta de ${DIV[divId].n} se descarta sin pelear.`});
    opts.dobleJ=true;
  }
  // Veterano del rival puede cambiar la stat
  stat=aplicarVeterano(P,'r',divId,stat);
  resolverDuelo(P,divId,stat,opts);
  tmp.divSel=null; tmp.statSel=null; tmp.camaleon=null;
  render();
}

function turnoIA(){
  if(P.fase!=='duelos'||P.turno!=='r') return;
  // jugada del rival: cambio de división
  const camb=iaJugada(P);
  if(camb) hacerCambio(P,'r',camb[0],camb[1]);
  const dec=iaDeclara(P);
  let divId=dec.div, stat=dec.stat;
  // ¿usa Incómodo?
  const rIn=rasgoDe(P.cartas.r[divId],'incomodo');
  const otra=segundaCartaIncomodo(P,'j',divId,rIn);
  if(rIn && !P.jugada.r && otra && Math.random()<.6){
    P.jugada.r=true;
    P.pendiente={divId,stat,plus:rIn.plus,opciones:shuffle([divId,otra])};
    P.fase='incomodo';
    P.log.push({t:'sys',x:`🌀 El rival activa Incómodo${rIn.plus?'+':''}.`});
    render(); return;
  }
  // Veterano del jugador (reacción automática si le conviene)
  stat=aplicarVeteranoJugador(divId,stat);
  P.log.push({t:'sys',x:`El rival declara ${DIV[divId].n} · ${stat.toUpperCase()}.`});
  resolverDuelo(P,divId,stat,{});
  render();
}

// Segunda carta que se le enseña al defensor. El normal exige división contigua;
// el plus vale cualquiera en juego. Devuelve null si no hay ninguna → rasgo no usable.
function segundaCartaIncomodo(P,defensor,divId,rasgo){
  if(!rasgo) return null;
  const libres=librePara(P,defensor).filter(v=>v!==divId);
  const cand=rasgo.plus?libres:libres.filter(v=>contiguas(v,divId));
  return cand.length?pick(cand):null;
}

function aplicarVeteranoJugador(divId,stat){
  const c=P.cartas.j[divId]; const r=rasgoDe(c,'veterano');
  if(!r||P.jugada.j) return stat;
  const otras=P.statsVivas.filter(s=>s!==stat);
  if(!otras.length) return stat;
  const actual=valorCarta(P,'j',divId,stat);
  const mejor=otras.slice().sort((a,b)=>valorCarta(P,'j',divId,b)-valorCarta(P,'j',divId,a))[0];
  if(valorCarta(P,'j',divId,mejor)<=actual+6) return stat;   // no merece la pena
  P.jugada.j=true;
  const nueva=r.plus?mejor:pick(otras);
  P.log.push({t:'sys',x:`🧠 Tu Veterano cambia la stat de ${stat.toUpperCase()} a ${nueva.toUpperCase()}.`});
  return nueva;
}

// Resolución del Incómodo: la carta elegida pelea en la división declarada.
// Si fallas, come la penalización y las dos cartas intercambian slot —
// así cada peleador sigue peleando una sola vez y el calendario cuadra.
function resolverIncomodo(idx){
  const q=P.pendiente, elegida=q.opciones[idx];
  if(elegida===q.divId){
    P.log.push({t:'sys',x:`Aciertas la división: duelo limpio en ${DIV[q.divId].n}.`});
  }else{
    const enviada=P.cartas.j[elegida];
    intercambiarSlots(P,'j',elegida,q.divId);
    penaliza(P,'j',q.divId,SID,q.plus?-12:-6);
    P.log.push({t:'sys',x:`Fallas: ${enviada.nombre} pelea en ${DIV[q.divId].n} con ${q.plus?-12:-6}. Tu otra carta cubre ${DIV[elegida].n}.`});
  }
  P.pendiente=null; P.fase='duelos';
  P.log.push({t:'sys',x:`El rival declara ${DIV[q.divId].n} · ${q.stat.toUpperCase()}.`});
  resolverDuelo(P,q.divId,q.stat,{});
  render();
}

/* ══════════════════════════════════════════════════════════════════════════
   11. EVENTOS
   ══════════════════════════════════════════════════════════════════════════ */
function ov(html){
  const d=document.createElement('div'); d.className='ov'; d.id='ov';
  d.innerHTML=`<div class="box">${html}</div>`;
  document.body.appendChild(d);
}
function cerrarOv(){ const o=$('#ov'); if(o) o.remove(); }

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-nav],[data-a],[data-f],[data-carta],[data-slot],[data-poner],[data-rec],[data-rol],[data-veto],[data-dsel],[data-ssel],[data-cambio],[data-camaleon],[data-incomodo],[data-eleccion],[data-pido],[data-ofrezco]');
  if(!t) return;
  const d=t.dataset;

  if(d.nav){ cerrarOv(); ir(d.nav); return; }
  if(d.f!==undefined){ tmp.filtro={...(tmp.filtro||{})}; tmp.filtro[d.f]=d.v||null; render(); return; }
  if(d.carta){ detalleCarta(d.carta); return; }
  if(d.slot&&vista==='plantilla'){ elegirParaSlot(d.slot); return; }
  if(d.poner){ S.plantilla[d.div]=d.poner; guardar(); cerrarOv(); render(); return; }
  if(d.rec){
    tmp.sel=tmp.sel||[];
    tmp.sel=tmp.sel.includes(d.rec)?tmp.sel.filter(x=>x!==d.rec):[...tmp.sel,d.rec];
    render(); return;
  }
  if(d.rol){ elegirRol(d.rol); return; }
  if(d.veto){ vetar(d.veto); return; }
  if(d.dsel){ if(tmp.divSel!==d.dsel) tmp.camaleon=null; tmp.divSel=d.dsel; render(); return; }
  if(d.ssel){ tmp.statSel=d.ssel; render(); return; }
  if(d.cambio!==undefined&&d.cambio!==''){
    const c=cambiosPosibles(P,'j')[+d.cambio]; hacerCambio(P,'j',c[0],c[1]); render(); return;
  }
  if(d.camaleon!==undefined&&d.camaleon!==''){
    tmp.camaleon=camaleonesPosibles(P,'j',tmp.divSel)[+d.camaleon];
    P.log.push({t:'sys',x:'Camaleón preparado — se aplica al declarar.'}); render(); return;
  }
  if(d.incomodo){ tmp.incomodo=true; P.jugada.j=true;
    P.log.push({t:'sys',x:'🌀 Activas Incómodo. El rival elegirá a ciegas.'}); render(); return; }
  if(d.eleccion!==undefined&&d.eleccion!==''){ resolverIncomodo(+d.eleccion); return; }
  if(d.pido!==undefined&&d.pido!==''){
    const c=tmp.sala.oferta[+d.pido]; tmp.pido=tmp.pido||[];
    tmp.pido=tmp.pido.includes(c)?tmp.pido.filter(x=>x!==c):(tmp.pido.length<3?[...tmp.pido,c]:tmp.pido);
    render(); return;
  }
  if(d.ofrezco){
    tmp.ofrezco=tmp.ofrezco||[];
    tmp.ofrezco=tmp.ofrezco.includes(d.ofrezco)?tmp.ofrezco.filter(x=>x!==d.ofrezco)
      :(tmp.ofrezco.length<3?[...tmp.ofrezco,d.ofrezco]:tmp.ofrezco);
    render(); return;
  }

  switch(d.a){
    case 'jugar': empezarPartida(); break;
    case 'gratis':{
      const g=GRATIS.find(x=>x.id===d.g); if(!g||!listoGratis(g)) break;
      S.gratis[g.id]=Date.now();
      S.sobres.push({tipo:g.tipo});   // se guarda, no se abre: acumular es la gracia
      guardar(); render(); break; }
    case 'comprar':{
      const T=TIPOS_SOBRE[d.t]; if(S.divisa<T.coste) break;
      S.divisa-=T.coste; S.sobres.push({tipo:d.t}); guardar(); render(); break; }
    case 'abrir':{
      const i=S.sobres.findIndex(s=>s.tipo===d.t); if(i<0) break;
      S.sobres.splice(i,1); abrirTanda(abrirSobre(d.t),d.t); break; }
    case 'abrirtodo':{
      const items=[];
      for(let i=S.sobres.length-1;i>=0;i--) if(S.sobres[i].tipo===d.t){ S.sobres.splice(i,1); items.push(...abrirSobre(d.t)); }
      abrirTanda(items,d.t); break; }
    case 'revelar':
      if(!tmp.ap||tmp.ap.resumen) break;
      if(tmp.ap.i+1>=tmp.ap.items.length) tmp.ap.resumen=true; else tmp.ap.i++;
      render(); break;
    case 'saltar':
      if(tmp.ap) tmp.ap.resumen=true;
      render(); break;
    case 'salirapertura': ir('sobres'); break;
    case 'autoplantilla': autoPlantilla(S); guardar(); render(); break;
    case 'reciclar':{
      const g=reciclar(tmp.sel||[]); tmp.sel=[];
      ov(`<div class="center"><div style="font-size:38px">🎟️</div><h3>+${g} ficha(s)</h3>
        <button class="btn" data-a="cerrarov">Vale</button></div>`); render(); break; }
    case 'canjearset':{
      const s=SETS.find(x=>x.id===d.id); if(!s||!setListo(s)) break;
      for(const cid of s.req){ const it=S.coleccion.find(x=>x.cid===cid&&!Object.values(S.plantilla).includes(x.iid));
        if(it) S.coleccion=S.coleccion.filter(x=>x.iid!==it.iid); }
      const pool=alineables().filter(c=>c.rareza===s.premio);
      const c=pick(pool);
      S.coleccion.push({iid:'i'+Math.random().toString(36).slice(2,9),cid:c.id,notraspasable:true});
      S.sets.push(s.id); guardar();
      ov(`<div class="center"><h3>Set completado</h3><div style="max-width:190px;margin:12px auto">${cartaHTML(c)}</div>
        <div class="sub mb">Carta de set: no traspasable, pero sí reciclable.</div>
        <button class="btn" data-a="cerrarov">Vale</button></div>`); render(); break; }
    case 'reto': tmp.reto=d.id; tmp.sel=[]; render(); break;
    case 'salirreto': tmp.reto=null; tmp.sel=[]; break;
    case 'entregarreto':{
      const r=RETOS.find(x=>x.id===tmp.reto);
      const cartas=(tmp.sel||[]).map(iid=>PORID[inst(iid).cid]);
      if(!r||!r.check(cartas)) break;
      for(const iid of tmp.sel) S.coleccion=S.coleccion.filter(x=>x.iid!==iid);
      S.sobres.push({tipo:r.premio.sobre}); S.divisa+=r.premio.divisa; S.retos.push(r.id);
      tmp.reto=null; tmp.sel=[]; guardar();
      ov(`<div class="center"><h3>Reto superado</h3><div class="sub mb">Has ganado ${TIPOS_SOBRE[r.premio.sobre].n}${r.premio.divisa?' y 🪙 '+r.premio.divisa:''}.</div>
        <button class="btn" data-a="cerrarov">Vale</button></div>`); render(); break; }
    case 'entrarsala':{
      if(S.fichas<1) break;
      S.fichas--; guardar();
      const pool=shuffle(ROSTER).slice(0,6);
      tmp.sala={oferta:pool,deseos:shuffle(ROSTER.filter(c=>c.rareza==='oro'||c.rareza==='elite')).slice(0,3).map(c=>c.nombre)};
      tmp.ofrezco=[]; tmp.pido=[]; render(); break; }
    case 'proponer':{
      const val=l=>l.reduce((a,c)=>a+({bronce:1,plata:4,oro:14,elite:45,leyenda:150})[c.rareza],0);
      const mias=(tmp.ofrezco||[]).map(i=>PORID[inst(i).cid]);
      const suyas=tmp.pido||[];
      if(val(suyas)<=val(mias)*1.15){
        for(const iid of tmp.ofrezco) S.coleccion=S.coleccion.filter(x=>x.iid!==iid);
        for(const c of suyas) S.coleccion.push({iid:'i'+Math.random().toString(36).slice(2,9),cid:c.id});
        guardar(); tmp.sala=null; tmp.ofrezco=[]; tmp.pido=[];
        ov(`<div class="center"><div style="font-size:38px">🤝</div><h3>Trato cerrado</h3>
          <button class="btn" data-a="cerrarov">Vale</button></div>`);
      }else{
        ov(`<div class="center"><h3>Rechazado</h3><div class="sub mb">No le compensa. Prueba a ofrecer más
          o a pedir menos — el valor lo fijáis vosotros, el sistema no pone precios.</div>
          <button class="btn" data-a="cerrarov">Vale</button></div>`);
      }
      render(); break; }
    case 'salirsala': tmp.sala=null; tmp.ofrezco=[]; tmp.pido=[]; render(); break;
    case 'iaturno': turnoIA(); break;
    case 'declarar':{
      if(!tmp.divSel||!tmp.statSel) break;
      const extra={};
      if(tmp.camaleon) extra.camaleon=tmp.camaleon;
      if(tmp.incomodo){
        // El rival elige a ciegas: si falla, su carta come la penalización
        const inc=rasgoDe(P.cartas.j[tmp.divSel],'incomodo');
        const otra=segundaCartaIncomodo(P,'r',tmp.divSel,inc);
        if(otra){
          const elegida=iaEligeIncomodo(P,shuffle([tmp.divSel,otra]));
          if(elegida!==tmp.divSel){
            intercambiarSlots(P,'r',elegida,tmp.divSel);
            penaliza(P,'r',tmp.divSel,SID,inc.plus?-12:-6);
            P.log.push({t:'sys',x:`El rival falla la elección y come ${inc.plus?-12:-6}.`});
          }else P.log.push({t:'sys',x:'El rival acierta la división: duelo limpio.'});
        }
        tmp.incomodo=false;
      }
      const dv=tmp.divSel, st=tmp.statSel;
      tmp.camaleon=null;
      P.log.push({t:'sys',x:`Declaras ${DIV[dv].n} · ${st.toUpperCase()}.`});
      declarar(dv,st,extra); break; }
    case 'desempate': resolverDesempate(P); render(); break;
    case 'abandonar':
      if(P&&P.fase!=='fin'){ P.fase='fin'; P.fin='r'; P.log.push({t:'sys',x:'Abandonas: cuenta como derrota.'}); }
      render(); break;
    case 'reiniciar':
      ov(`<div class="center"><h3>¿Borrar todo?</h3><div class="sub mb">Se pierde la colección entera.</div>
        <button class="btn" data-a="reiniciar2">Sí, borrar</button>
        <button class="btn sec" data-a="cerrarov" style="margin-top:7px">No</button></div>`); break;
    case 'reiniciar2': localStorage.removeItem(KEY); location.reload(); break;
    case 'cerrarov': cerrarOv(); break;
  }
});

/* ══════════════════════════════════════════════════════════════════════════
   12. ARRANQUE
   ══════════════════════════════════════════════════════════════════════════ */
generarRoster();
SETS=construirSets();
if(!cargar()) S=estadoNuevo();
if(!S.sets) S.sets=[];
if(!S.retos) S.retos=[];
if(!S.gratis) S.gratis={};        // partidas guardadas antes de los sobres gratis por niveles
guardar();
render();

// Los relojes de los sobres gratis corren siempre, se esté donde se esté.
setInterval(()=>{ if(vista==='sobres'||vista==='inicio') actualizarRelojes(); },1000);
</script>
