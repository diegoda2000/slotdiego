<title>Jaula Abierta</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
/* ═══════════════════════════════════════════════════════════════
   PROTOTIPO JUGABLE — juego de cartas de MMA
   Cartas y peleadores 100% inventados.
   ═══════════════════════════════════════════════════════════════ */
/* Oswald: condensada y de peso alto, que es por dónde va la tipografía de la UFC.
   Va dentro de la aplicación, no de un servidor de fuentes: el juego tiene que verse
   igual sin conexión y dentro del APK. 40 KB los dos subconjuntos. */
@font-face{font-family:Oswald;src:url(fuentes/oswald-latin.woff2) format('woff2');
  font-weight:200 700;font-display:swap;
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+2122,U+2212}
@font-face{font-family:Oswald;src:url(fuentes/oswald-latin-ext.woff2) format('woff2');
  font-weight:200 700;font-display:swap;
  unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+1E00-1E9F,U+2C60-2C7F,U+A720-A7FF}
:root{
  --titulo:Oswald,"Roboto Condensed","Avenir Next Condensed","Arial Narrow",system-ui,sans-serif;
  --bg:#0d1014; --bg2:#141920; --bg3:#1c232c; --line:#2a323d;
  --txt:#e8edf3; --dim:#8b97a6; --dim2:#5d6874;
  --acc:#e0483a; --acc2:#ff6b5b; --ok:#3fb96b; --warn:#e8b13a;
  --plata:#9aa8b5; --oro:#d9a441; --corona:#ffd76a;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--txt);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;
  overscroll-behavior:none;padding-bottom:64px}
#app{max-width:760px;margin:0 auto;padding:12px 12px 20px}
h1,h2,h3{font-family:var(--titulo);font-weight:600;letter-spacing:.005em;text-transform:uppercase}
h2{font-size:19px;margin-bottom:2px}
h3{font-size:15px;margin-bottom:8px}
.sub{color:var(--dim);font-size:13px}
.tiny{font-size:12px;color:var(--dim2)}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
.btn{font-family:var(--titulo);letter-spacing:.03em;background:var(--acc);color:#fff;border-radius:9px;padding:11px 16px;font-weight:650;font-size:14px;
  display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:.12s;width:100%}
.btn:active{transform:scale(.975)}
.btn:disabled{opacity:.32;cursor:default;transform:none}
.btn.sec{background:var(--bg3);border:1px solid var(--line)}
.btn.gho{background:transparent;border:1px solid var(--line);color:var(--dim)}
.btn.sm{padding:7px 12px;font-size:13px;width:auto}
.row{display:flex;gap:8px}
.row>*{flex:1}
.card-panel{background:var(--bg2);border:1px solid var(--line);border-radius:13px;padding:14px;margin-bottom:11px}

/* ── barra superior ── */
#top{display:flex;align-items:center;gap:9px;padding:9px 12px;background:var(--bg2);
  border-bottom:1px solid var(--line);position:sticky;top:0;z-index:50}
#top .logo{font-weight:800;font-size:15px;letter-spacing:-.03em;margin-right:auto}
#top .logo span{color:var(--acc)}
.res{display:flex;align-items:center;gap:4px;font-size:13px;font-weight:650;
  background:var(--bg3);padding:5px 9px;border-radius:7px;white-space:nowrap}

/* ── navegación ── */
#nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--bg2);
  border-top:1px solid var(--line);z-index:50;padding-bottom:env(safe-area-inset-bottom)}
#nav button{font-family:var(--titulo);letter-spacing:.03em;flex:1;padding:9px 2px 10px;font-size:10.5px;color:var(--dim2);
  display:flex;flex-direction:column;align-items:center;gap:3px;font-weight:600}
#nav button .ic{font-size:19px;line-height:1}
#nav button.on{color:var(--acc2)}
#nav .badge{position:absolute;transform:translate(15px,-4px);background:var(--acc);color:#fff;
  border-radius:9px;font-size:9px;padding:1px 5px;font-weight:700}

/* ── CARTA ──
   La carta es el marco (una imagen) con el texto colocado encima en porcentajes, así
   que se ve igual a cualquier tamaño: no hay una versión por tamaño, hay una sola que
   escala. Las medidas salen de medir los huecos del propio marco, no a ojo.

   Todo el texto se mide contra `--cw`, el ancho de la propia carta en píxeles, que lo
   pone medirCartas() después de cada pintado. Antes esto iba en `cqw`, que es más
   elegante —lo resuelve el navegador solo—, pero las consultas de contenedor no existen
   en los WebView antiguos, y ahí el texto se quedaba en un tamaño fijo: en la rejilla de
   sobres y colección, con cartas de 124 px, los números se salían de los rombos y los
   nombres del recuadro. Con una variable y calc() se ve igual en cualquier motor. */
.carta{position:relative;aspect-ratio:620/877;
  font-family:var(--titulo);
  background:#0b0d10 center/100% 100% no-repeat;border-radius:9px;overflow:hidden;
  cursor:pointer;color:#fff;font-size:calc(var(--cw,110px)*.034);line-height:1.1;
  transition:transform .15s,filter .15s}
.carta.oro  {background-image:url(marcos/oro.webp)}
.carta.plata{background-image:url(marcos/plata.webp)}
.carta.sel{outline:2px solid var(--acc);outline-offset:1px}
.carta:active{transform:scale(.985)}

/* Los huecos del marco, medidos sobre la propia imagen con un cuentapíxeles. */

/* Pestaña del ranking. Es un paralelogramo inclinado hacia abajo-izquierda: arriba va de
   x 6,5 a 29,8% y baja con pendiente -1,41% de x por cada 1% de y, así que su esquina
   inferior izquierda se sale de la carta y queda cortada por el borde.
   Centrar dentro de la figura real deja el número escorado a la izquierda, porque el ojo
   ve el hueco recortado, de x 1,9 a 29,8%, cuyo centro está en el 15,9%. Así que se centra
   como si fuera un rectángulo, tirando a la derecha hasta donde la tinta sigue pisando
   metal. El límite duro son las cifras a la altura del 13,9%; se deja en el 12,9%, un pelo
   a la izquierda, que es donde el ojo lo da por centrado. */
/* El ranking NO lleva el desplazamiento por altura de mayúsculas que sí llevan los
   números y el nombre. Aquí el hueco no es un rectángulo sino un paralelogramo que se
   estrecha hacia abajo, así que bajar la cifra la descentra en vez de centrarla: se
   queda donde la caja la pone. */
.carta .c-rk{position:absolute;left:7.4%;width:11%;top:2.4%;height:7%;
  display:flex;align-items:center;justify-content:center;line-height:1;
  font-weight:700;color:#3a2a09;font-size:calc(var(--cw,110px)*.062);letter-spacing:-.04em;
  text-shadow:0 .07em 0 rgba(255,255,255,.42), 0 -.04em .03em rgba(0,0,0,.5)}
.carta.plata .c-rk{color:#23272c;
  text-shadow:0 .07em 0 rgba(255,255,255,.5), 0 -.04em .03em rgba(0,0,0,.45)}

.carta .c-mid{position:absolute;left:12%;right:12%;top:15%;height:40%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:6%;text-align:center}
.carta .c-icono{font-size:calc(var(--cw,110px)*.17);line-height:1;
  filter:drop-shadow(0 2px 6px rgba(0,0,0,.6))}
.carta .c-rasgo{font-weight:600;letter-spacing:.07em;text-transform:uppercase;
  font-size:calc(var(--cw,110px)*.027);line-height:1.2;color:var(--warn)}
.carta.plata .c-rasgo{color:#cfd6dd}
/* El récord va en el panel blanco, entre la placa del nombre y las stats. Medida
   sobre el marco: la franja de y 70,6% a 75,3% está limpia de lado a lado, y las
   etiquetas de las stats empiezan en el 75,32%, así que cabe con aire. */
.carta .c-record{position:absolute;left:12%;right:12%;top:71.2%;height:3.6%;
  display:flex;align-items:center;justify-content:center;line-height:1;
  color:#3a3d42;font-weight:700;letter-spacing:.05em;
  font-size:calc(var(--cw,110px)*.028)}
.carta.plata .c-record{color:#33383e}
/* En la carta compacta de la plantilla no cabe, y a ese tamaño no se leería. */
.carta.compacta .c-record{display:none}

/* Placa del nombre: x 25,3–74,2%, y 66,02–70,51%. Centrado en los dos ejes. Lo largo
   que sea el nombre lo pone tamNombre() en --nom, para llenar la placa sin salirse. */
/* Ni el nombre ni los números llevan desplazamiento: el centrado del navegador ya los
   deja donde toca. Lo comprueba herramientas/medir-carta.mjs, que no calcula nada —
   dibuja la carta a tamaño natural y mira en qué píxeles cae la tinta. Tal como está:
   el nombre ocupa del 66,99% al 70,41% y su placa va del 66,02% al 70,51%. */
.carta .c-nom{position:absolute;left:25.3%;right:25.8%;top:66.02%;height:4.49%;
  display:flex;align-items:center;justify-content:center;line-height:1;
  color:#2e2107;font-weight:700;font-size:calc(var(--cw,110px)*var(--nom,.045));
  overflow:hidden;white-space:nowrap;padding:0 1.5%;
  text-shadow:0 .07em 0 rgba(255,255,255,.45), 0 -.04em .03em rgba(0,0,0,.45)}
.carta.plata .c-nom{color:#1a1e22;
  text-shadow:0 .07em 0 rgba(255,255,255,.55), 0 -.04em .03em rgba(0,0,0,.4)}

/* El reflejo. Una franja de luz cruzada por encima, que es lo que hace que el texto
   parezca parte del metal y no una pegatina puesta encima. */
/* El reflejo va pegado al hueco del marco, no al texto. */
.carta .brillo{position:absolute;inset:0;pointer-events:none;border-radius:inherit;
  background:linear-gradient(104deg,
    rgba(255,255,255,0) 26%, rgba(255,255,255,.34) 41%,
    rgba(255,255,255,.10) 52%, rgba(255,255,255,0) 66%)}

/* El número va dentro del rombo, centrado; el nombre de la stat, centrado sobre su
   línea y apoyado en ella. */
/* Los tres rombos de la izquierda están, en el dibujo del marco, en el 76,05-78,22%,
   82,33-84,49% y 88,71-90,88% de la altura. Las cifras caen dentro de los tres sin tocar
   nada: 76,17-78,16 en el primero. */
.carta .c-num{position:absolute;height:2.17%;display:flex;align-items:center;
  justify-content:center;line-height:1;color:#2b1f07;font-weight:700;
  font-size:calc(var(--cw,110px)*.036);font-variant-numeric:tabular-nums}
.carta.plata .c-num{color:#15181c}
.carta .c-num.pen{color:#7a1109}
.carta .c-num.up{color:#0f4a22}
.carta .c-et{position:absolute;height:2.9%;display:flex;align-items:flex-end;
  justify-content:center;line-height:1;color:#3a3d42;font-weight:600;
  letter-spacing:.03em;font-size:calc(var(--cw,110px)*.042)}

/* Bandera y peso, centrados en el hueco libre del panel blanco (y 91–97%). */
/* Bandera y peso. Centrar el par como un bloque los deja torcidos: la bandera es más
   ancha que "HW", así que el hueco entre las dos cae a la derecha del eje de la carta
   y la bandera se ve escorada. Con dos mitades iguales, la frontera entre columnas
   ES el eje: la bandera se pega a él por la izquierda y el peso por la derecha, y sale
   simétrico con cualquier sigla, desde "HW" hasta "WFLW". */
.carta .c-pie{position:absolute;left:10%;right:10%;top:92%;height:4.4%;
  display:grid;grid-template-columns:1fr 1fr;align-items:center;column-gap:5%;
  color:#2b2e33;font-weight:700;letter-spacing:.08em;line-height:1;
  font-size:calc(var(--cw,110px)*.031)}
/* El alto va en em, no en porcentaje: dentro de una rejilla el porcentaje se resuelve
   contra una fila que aún no tiene altura definida y la bandera se dispara. En em queda
   además emparejada con la altura de las letras del peso, que es como debe leerse. */
.carta .c-pie .bnd{height:1.45em;width:auto;display:block;border-radius:1px;
  justify-self:end;box-shadow:0 0 0 .5px rgba(0,0,0,.35)}
/* Las letras del peso, a la misma altura que la bandera: el factor sale de medir,
   no de la ratio teórica de la fuente: se midió la tinta con las métricas del propio
   motor de texto y salió 1,74 em, no los 2 em que daba la cuenta a ojo. */
.carta .c-pie .peso{justify-self:start;font-size:1.74em;line-height:1}
/* Sin bandera —un país que no tenemos— el peso se queda centrado y no de lado. */
.carta .c-pie.sinbandera{display:flex;justify-content:center}

/* Boca abajo: la del rival mientras no se resuelve el duelo. */
.carta.tapada{display:grid;place-items:center;font-size:44px;font-weight:800;color:#46525f;
  background:repeating-linear-gradient(135deg,#1b222b,#1b222b 9px,#222b35 9px,#222b35 18px);
  border:1px dashed #3a4551;aspect-ratio:620/877;border-radius:9px}
.carta.oculta{display:grid;place-items:center;background:var(--bg2);
  border:1px dashed var(--line);color:var(--dim2);aspect-ratio:620/877;border-radius:9px}

/* Compacta, para que las once de la plantilla quepan a la vez: el marco se mantiene
   —es lo que distingue un oro de una plata de un vistazo— y se cae lo que a ese tamaño
   ya no se puede leer. */
.carta.compacta .c-rasgo,.carta.compacta .c-et{display:none}
.carta.compacta .c-icono{font-size:calc(var(--cw,110px)*.13)}
.carta.compacta .c-pie{letter-spacing:.04em}

/* La carta que enseña el sobre manda en la pantalla: se lleva todo el alto que queda
   por debajo de la barra, y el ancho sale de ahí por la proporción de la carta, así que
   ocupa lo máximo posible sin deformarse ni salirse por abajo. */
.apertura{display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:10px;cursor:pointer;min-height:calc(100vh - 210px);min-height:calc(100dvh - 210px)}
.apertura-carta{width:min(92vw, calc((100vh - 260px) * 620/877), calc((100dvh - 260px) * 620/877));
  filter:drop-shadow(0 10px 26px rgba(0,0,0,.6))}
.apertura-tit{font-size:15px;font-weight:800;letter-spacing:.1em;color:var(--warn)}
.apertura-pie{opacity:.75}

/* ── El aviso, la carta llenándose ──
   Todo pasa DENTRO de la carta: no hay panel aparte. Se pinta el marco entero y se
   destapa por partes, cada una en su hueco. Las clases se acumulan desde JS —ve-pais,
   ve-peso, ve-record, ve-rk, ve-todo— en vez de usar un selector por nivel, porque así
   funciona en cualquier motor, incluidos los WebView viejos. */
.aviso{gap:12px}
.aviso .apertura-carta{filter:drop-shadow(0 0 30px color-mix(in srgb,var(--luz) 55%,transparent))}
.aviso .aviso-et{font-family:var(--titulo);letter-spacing:.1em;text-transform:uppercase;
  font-size:11px;color:var(--luz)}

/* De partida, todo lo que se destapa después está oculto. */
.carta.revelando .c-pie .bnd,
.carta.revelando .c-pie .peso,
.carta.revelando .c-record,
.carta.revelando .c-rk,
.carta.revelando .c-mid,
.carta.revelando .c-nom,
.carta.revelando .c-num,
.carta.revelando .c-et{opacity:0;visibility:hidden}

/* Y cada clase enciende su parte. */
.carta.ve-pais   .c-pie .bnd,
.carta.ve-peso   .c-pie .peso,
.carta.ve-record .c-record,
.carta.ve-rk     .c-rk,
.carta.ve-todo   .c-mid,
.carta.ve-todo   .c-nom,
.carta.ve-todo   .c-num,
.carta.ve-todo   .c-et{opacity:1;visibility:visible;animation:aparece .5s ease both}
/* Desvanecido puro: solo opacidad. Cualquier salto o cambio de tamaño aquí se lee como
   un parpadeo de la carta, que es justo lo contrario de lo que tiene que parecer —el
   dato apareciendo de la nada, como un desvanecido al revés. */
@keyframes aparece{from{opacity:0}to{opacity:1}}

/* ── Nada de esto puede parpadear ──
   La carta está en pantalla de principio a fin y no se mueve. Lo único que ocurre es que
   sus partes APARECEN —el efecto contrario a desvanecerse—, y para eso solo se toca la
   opacidad: ni saltos, ni escalas, ni temblores. Cualquier cosa que mueva o redibuje la
   carta entera se lee como un parpadeo, que es justo lo que no se quiere. */
.apertura-carta{position:relative;transition:filter .5s ease}
.aviso .apertura-carta{filter:drop-shadow(0 0 22px color-mix(in srgb,var(--luz) 40%,transparent))}
.aviso.suelta .apertura-carta{filter:drop-shadow(0 0 34px color-mix(in srgb,var(--luz) 62%,transparent))}
/* El aura del nivel: entra desvaneciéndose hacia dentro y se queda quieta. No late. */
.aviso .apertura-carta::before{content:'';position:absolute;inset:-12%;z-index:-1;
  border-radius:50%;pointer-events:none;opacity:0;
  background:radial-gradient(closest-side,color-mix(in srgb,var(--luz) 40%,transparent),transparent 72%);
  animation:aparece .9s ease both}
/* El título de corona o top 5, apagado hasta que la carta está entera. */
.apertura-tit{transition:opacity .5s ease}
.apertura-tit.apagado{opacity:0;visibility:hidden}

/* El destello final: una franja de luz que barre la carta entera una sola vez, cuando ya
   está completa. Es lo que la remata, y es lo único que se mueve en toda la pantalla. */
.destello{position:absolute;inset:0;pointer-events:none;border-radius:9px;
  overflow:hidden;mix-blend-mode:screen;opacity:0}
.suelta .destello{opacity:1}
.suelta .destello::after{content:'';position:absolute;top:-60%;bottom:-60%;width:46%;left:-60%;
  transform:skewX(-18deg);
  background:linear-gradient(90deg,
    rgba(255,255,255,0), rgba(255,255,255,.16) 34%,
    rgba(255,255,255,.62) 50%, rgba(255,255,255,.16) 66%, rgba(255,255,255,0));
  animation:barrido .9s .1s cubic-bezier(.3,0,.2,1) both}
@keyframes barrido{from{left:-60%}to{left:118%}}
/* La corona se lleva un segundo barrido, más tenue y del color de su nivel. */
.suelta .apertura-carta.n-corona .destello::before{content:'';position:absolute;
  top:-60%;bottom:-60%;width:30%;left:-60%;transform:skewX(-18deg);
  background:linear-gradient(90deg,rgba(255,255,255,0),
    color-mix(in srgb,var(--luz) 55%,transparent) 50%,rgba(255,255,255,0));
  animation:barrido 1.05s .5s cubic-bezier(.3,0,.2,1) both}

/* Quien pide menos movimiento en su móvil no tiene por qué tragarse nada de esto. */
@media (prefers-reduced-motion: reduce){
  .carta.ve-pais .c-pie .bnd,.carta.ve-peso .c-pie .peso,.carta.ve-record .c-record,
  .carta.ve-rk .c-rk,.carta.ve-todo .c-mid,.carta.ve-todo .c-nom,
  .carta.ve-todo .c-num,.carta.ve-todo .c-et{animation-duration:.01ms}
  .aviso .apertura-carta::before{animation:none;opacity:1}
  .suelta .destello::after,.suelta .apertura-carta.n-corona .destello::before{animation:none;opacity:0}
}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:8px}
.grid.g3{grid-template-columns:repeat(3,1fr)}

/* Rejillas que caben en pantalla: el número de columnas lo fija cada pantalla y el
   ancho total lo calcula ajustarRejillas() midiendo el hueco que queda. */
.grid.fit{grid-template-columns:repeat(var(--cols,3),1fr);gap:6px;
  max-width:var(--rejilla,100%);margin:0 auto}
.grid.fit .pie-carta{margin-top:1px;font-size:8px;line-height:1.1;text-align:center;
  color:var(--dim2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grid.fit>div{display:flex;flex-direction:column;min-width:0}

/* El álbum de la colección: páginas de 4×4 que se pasan, nunca scroll. */
.album-nav{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:8px}
.album-nav .pag{font-family:var(--titulo);font-size:12px;color:var(--dim);
  letter-spacing:.06em;min-width:96px;text-align:center}
.album-nav button{flex:none;min-width:52px}

/* ── varios ── */
.chip{font-family:var(--titulo);letter-spacing:.05em;display:inline-block;background:var(--bg3);border:1px solid var(--line);border-radius:6px;
  padding:3px 8px;font-size:11.5px;color:var(--dim);font-weight:600}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.chip.dead{opacity:.28;text-decoration:line-through}
.chip.next{border-color:var(--acc2);color:var(--acc2)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.bar{height:5px;background:var(--bg3);border-radius:3px;overflow:hidden;margin-top:5px}
.bar>div{height:100%;background:var(--acc)}
.divider{height:1px;background:var(--line);margin:12px 0}
.center{text-align:center}
.mb{margin-bottom:10px}
.log{font-size:12.5px;color:var(--dim);border-left:2px solid var(--line);padding:4px 0 4px 9px;margin-bottom:5px}
.log b{color:var(--txt)}
.log.win{border-color:var(--ok)} .log.lose{border-color:var(--acc)}
.mark{font-family:var(--titulo);display:flex;gap:6px;align-items:center;justify-content:center;font-size:26px;font-weight:800;
  letter-spacing:-.03em}
.mark .vs{font-size:13px;color:var(--dim2);font-weight:600}
.ov{position:fixed;inset:0;background:rgba(6,8,11,.9);z-index:100;display:flex;
  align-items:center;justify-content:center;padding:16px;overflow-y:auto}
.ov .box{background:var(--bg2);border:1px solid var(--line);border-radius:15px;padding:18px;
  max-width:420px;width:100%;max-height:92vh;overflow-y:auto}

<script>
"use strict";
/* ══════════════════════════════════════════════════════════════════════════
   4. ESTADO DEL JUGADOR
   ══════════════════════════════════════════════════════════════════════════ */
const KEY='jaula-abierta-v1';
let S=null;

function estadoNuevo(){
  const s={divisa:250,fichas:0,coleccion:[],plantilla:{},sobres:[],
    partidas:0,victorias:0,gratis:{},sets:[],retos:[],nombre:'',amigos:[],
    tutorialHecho:false,tutorCortado:false,mudo:false};
  /* Arranque garantizado: una plata por división. Sin repetir peleador — hay quien
     tiene carta de plata en dos divisiones, y si al sortear cae el mismo en las dos, una
     división se queda sin nadie alineable y el jugador nuevo no puede ni empezar. */
  const usados=new Set();
  for(const d of DIVISIONES){
    const cand=alineables().filter(c=>c.division===d.id&&c.estatus==='plata'&&!usados.has(c.persona));
    const c=pick(cand.length?cand:alineables().filter(x=>x.division===d.id&&x.estatus==='plata'));
    usados.add(c.persona);
    s.coleccion.push({iid:'i'+Math.random().toString(36).slice(2,9),cid:c.id});
  }
  // Carta de rasgo inicial: fija, rasgo normal, no traspasable. Sin ella un novato
  // juega sin la única herramienta de la partida. La más floja que cumpla: es una
  // herramienta, no un regalo.
  const conRasgo=ordenar(alineables().filter(c=>c.rasgos.length===1&&!c.rasgos[0].plus)).reverse();
  if(conRasgo.length) s.coleccion.push({iid:'i-start',cid:conRasgo[0].id,notraspasable:true});
  // Bono de bienvenida, una sola vez: 2 de oro y 2 de plata, gratis.
  s.sobres=[{tipo:'oro'},{tipo:'oro'},{tipo:'plata'},{tipo:'plata'}];
  autoPlantilla(s);
  return s;
}
/* Rellenar con lo mejor. Antes solo tocaba los huecos VACÍOS, así que en cuanto tenías
   los once puestos el botón no hacía absolutamente nada — parecía roto porque lo estaba.
   Con `rehacer` tira la alineación y la monta entera desde cero.

   El criterio es el orden deportivo: campeón, top 5, top 6-10, top 11-15, oro sin
   rankear y plata; y dentro del mismo tramo, el de más stats sumadas.

   Se recorre por divisiones EMPEZANDO por las que menos donde elegir tienen, porque
   quien reparte primero se lleva a los peleadores dobles y deja al resto sin nada. */
function autoPlantilla(s,rehacer){
  if(rehacer) s.plantilla={};
  const porDivision=d=>s.coleccion.filter(x=>{const c=PORID[x.cid];return c.alineable&&c.division===d.id});
  const orden=DIVISIONES.slice().sort((a,b)=>porDivision(a).length-porDivision(b).length);
  for(const d of orden){
    if(s.plantilla[d.id]) continue;
    const cands=porDivision(d);
    if(!cands.length) continue;
    cands.sort((a,b)=>comparar(PORID[a.cid],PORID[b.cid]));   // orden deportivo: mejor primero
    for(const cd of cands){ if(!personaRepetida(s,cd,d.id)){ s.plantilla[d.id]=cd.iid; break; } }
  }
}
function personaRepetida(s,cardInst,divId){
  const per=PORID[cardInst.cid].persona;
  return Object.entries(s.plantilla).some(([dv,iid])=>{
    if(dv===divId) return false;
    const o=s.coleccion.find(x=>x.iid===iid);
    return o && PORID[o.cid].persona===per;
  });
}
// Si el navegador bloquea localStorage (origen opaco, modo privado), el juego sigue
// funcionando en memoria durante la sesión en vez de reventar.
let ALMACEN_OK=true;
function guardar(){ try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){ALMACEN_OK=false} }
function cargar(){
  try{const r=localStorage.getItem(KEY); if(r){S=JSON.parse(r); return true}}
  catch(e){ALMACEN_OK=false}
  return false;
}
// No basta con que el hueco tenga algo escrito: la carta tiene que existir todavía en
// la colección. Si no, un guardado desincronizado revienta la partida a mitad.
const plantillaCompleta=()=>DIVISIONES.every(d=>{
  const iid=S.plantilla[d.id];
  return iid && S.coleccion.some(x=>x.iid===iid);
});
const inst=iid=>S.coleccion.find(x=>x.iid===iid);
const cartaDe=iid=>{const i=inst(iid);return i?PORID[i.cid]:null};

/* ══════════════════════════════════════════════════════════════════════════
   5. ECONOMÍA — sobres, reciclaje, sets, retos, intercambio
   ══════════════════════════════════════════════════════════════════════════ */
/* ── SOBRES ───────────────────────────────────────────────────────────────
   Dos sorteos por sobre, no uno. Primero se decide CUÁNTOS OROS trae; el resto de los
   nueve huecos se rellena con platas. Después, cada oro tira su nivel por separado.

   Separarlo así es lo que permite prometer "este sobre trae siete u ocho oros" sin que
   la calidad se dispare sola: la cantidad y el nivel son perillas independientes.

   Los niveles van por ESTATUS DEPORTIVO, no por ninguna media. "Corona" es campeón o
   top 5, que en la tabla de probabilidades van juntos. */
const CARTAS_POR_SOBRE=9;

/* Los niveles de un sobre NO son los tramos de estatus. El estatus ordena la colección
   y pone el precio del reciclaje, y va por bloques de cinco puestos. Aquí hace falta más
   fino: el sobre básico tiene que poder repartir un 12-15 de vez en cuando sin repartir
   nunca un 11, así que el corte está donde manda el reparto, no donde manda el orden. */
const NIVELES=[
  {id:'corona',  n:'Campeón o Top 5', cumple:c=>c.rk===0||(c.rk>=1&&c.rk<=5)},
  {id:'top611',  n:'Top 6-11',        cumple:c=>c.rk>=6&&c.rk<=11},
  {id:'top1215', n:'Top 12-15',       cumple:c=>c.rk>=12&&c.rk<=15},
  {id:'oro',     n:'Oro sin rankear', cumple:c=>c.rareza==='oro'&&!c.rk&&c.rk!==0},
];
const NIVEL_IDS=NIVELES.map(n=>n.id);

/* Y las platas también se parten en dos. El sobre de plata está para cerrar la colección
   de platas, y si repartiera por igual las buenas y las malas dejaría de tener recorrido:
   lo que cuesta completar son las de arriba. El corte va por la suma interna de las seis
   stats —la misma que desempata en el orden— y deja arriba un tercio. */
const PLATAS=[
  {id:'plataAlta', n:'Plata alta'},
  {id:'plataBaja', n:'Plata baja'},
];
const PLATA_IDS=PLATAS.map(p=>p.id);
let CORTE_PLATA=0;
function calcularCortePlata(){
  const sumas=ROSTER.filter(c=>c.rareza==='plata').map(c=>c.suma).sort((a,b)=>a-b);
  CORTE_PLATA=sumas.length?sumas[Math.floor(sumas.length*2/3)]:0;
}

/* Los tres sobres NO son el mismo sobre a distintos precios: cada uno hace una cosa.

   El BÁSICO es gratis e ilimitado, y está para que cualquiera pueda montarse un equipo
   desde el primer día. Por eso da muchos oros. Lo que casi no da es un oro ALTO: la
   corona y el top 10 son casi imposibles, y lo que llena el sobre son oros sin rankear
   y algún 11-15. Se hace un once entero, sí, pero no un once de campeones.

   El de PLATA se compra para cerrar la colección de platas, que es lo que da las cartas
   especiales. Por eso trae 1-3 oros y el resto platas: no compite con el básico, hace
   otra cosa. Comparar los dos por cuántos oros dan es comparar mal.

   El de ORO es el caro y el único que reparte cartas de arriba de verdad. */
const TIPOS_SOBRE={
  /* BÁSICO — gratis e ilimitado. Mitad oros y mitad platas, para que cualquiera monte
     un once desde el primer día. Lo que casi nunca da es un rankeado: cuando cae uno es
     de los últimos puestos, 12-15, y de ahí para arriba la probabilidad es simbólica.
     Se hace un equipo, no se hace un equipo de campeones. */
  basico:{n:'Sobre básico', ic:'📦', coste:0, unico:true, gratis:true,
    oros  :{3:15, 4:35, 5:35, 6:15},
    nivel :{corona:0.01, top611:0.09, top1215:3.9, oro:96},
    platas:{plataAlta:40, plataBaja:60}},
  /* PLATA — se compra para cerrar la colección de platas. Reparte sobre todo platas
     BAJAS: las de arriba son las que cuesta completar, y si cayeran por igual el sobre
     se quedaría sin recorrido a las pocas compras. */
  plata :{n:'Sobre de plata', ic:'🎁', coste:250,
    oros  :{1:40, 2:40, 3:20},
    nivel :{corona:0.30, top611:2, top1215:40, oro:57.7},
    platas:{plataAlta:8, plataBaja:92}},
  /* ORO — el caro, y el único que reparte cartas de arriba de verdad. */
  oro   :{n:'Sobre de oro', ic:'🥇', coste:600,
    oros  :{7:30, 8:45, 9:25},
    nivel :{corona:0.60, top611:3.20, top1215:46.2, oro:50},
    platas:{plataAlta:55, plataBaja:45}},
};
for(const t of Object.values(TIPOS_SOBRE)) t.cartas=CARTAS_POR_SOBRE;

/* Solo el básico se reclama gratis. Los de plata y oro se compran o se ganan en
   desafíos: ya no se regalan por reloj. */
const GRATIS=[{id:'g1', tipo:'basico', espera:0}];
const listoGratis=g=>g.espera===0||Date.now()-(S.gratis[g.id]||0)>=g.espera;
const restaGratis=g=>Math.max(0,g.espera-(Date.now()-(S.gratis[g.id]||0)));
// El ilimitado no cuenta para el aviso del menú: estaría encendido siempre.
const nGratisListos=()=>GRATIS.filter(g=>g.espera>0&&listoGratis(g)).length;
function reloj(ms){
  const s=Math.ceil(ms/1000), h=Math.floor(s/3600), m=Math.floor(s%3600/60), r=s%60;
  return h?`${h}:${String(m).padStart(2,'0')}:${String(r).padStart(2,'0')}`
          :`${m}:${String(r).padStart(2,'0')}`;
}

const sortearClave=tabla=>{
  const claves=Object.keys(tabla);
  const tot=claves.reduce((a,k)=>a+tabla[k],0);
  let r=Math.random()*tot;
  for(const k of claves){ if((r-=tabla[k])<0) return k; }
  return claves[claves.length-1];
};

/* Reparto del sobre: cuántos oros y de qué nivel cada uno. Se saca aparte de la
   apertura para poder comprobarlo con miles de tiradas sin tocar la colección. */
function repartoSobre(tipo){
  const T=TIPOS_SOBRE[tipo];
  const nOros=+sortearClave(T.oros);
  const niveles=[];
  for(let i=0;i<nOros;i++) niveles.push(sortearClave(T.nivel));
  // Y el resto, platas: cada sobre tiene su propia mezcla de altas y bajas.
  while(niveles.length<T.cartas) niveles.push(sortearClave(T.platas));
  return niveles;
}

const poolNivel=nivelId=>{
  if(nivelId==='plataAlta') return ROSTER.filter(c=>c.rareza==='plata'&&c.suma>=CORTE_PLATA);
  if(nivelId==='plataBaja') return ROSTER.filter(c=>c.rareza==='plata'&&c.suma< CORTE_PLATA);
  if(nivelId==='plata')     return ROSTER.filter(c=>c.rareza==='plata');
  return ROSTER.filter(NIVELES.find(n=>n.id===nivelId).cumple);
};
const esPlata=nivelId=>nivelId==='plata'||PLATA_IDS.includes(nivelId);

/* Un sobre no repite carta dentro de sí mismo. Si el nivel sorteado se queda sin
   candidatos nuevos —pasa en corona, que es un pool corto— se baja al nivel de al
   lado en vez de saltar a cualquier cosa: una sorpresa así parece un fallo. */
function cartaDeNivel(nivelId,yaEnElSobre){
  const orden=[...NIVEL_IDS,...PLATA_IDS];
  const i=orden.indexOf(nivelId);
  for(let d=0;d<orden.length;d++){
    for(const j of (d===0?[i]:[i+d,i-d])){
      if(j<0||j>=orden.length) continue;
      const pool=poolNivel(orden[j]).filter(c=>!yaEnElSobre.has(c.id));
      if(pool.length) return pick(pool);
    }
  }
  return pick(ROSTER.filter(c=>!yaEnElSobre.has(c.id))) || pick(ROSTER);
}

function abrirSobre(tipo){
  const salida=[], dentro=new Set();
  for(const nivel of repartoSobre(tipo)){
    const c=cartaDeNivel(nivel,dentro);
    dentro.add(c.id);
    const it={iid:'i'+Math.random().toString(36).slice(2,9),cid:c.id};
    S.coleccion.push(it); salida.push(it);
  }
  // Siempre de mejor a peor: el orden deportivo manda también aquí.
  salida.sort((a,b)=>comparar(PORID[a.cid],PORID[b.cid]));
  guardar(); return salida;
}

/* Probabilidad real de que un sobre traiga al menos una carta de corona. Es la cifra
   que de verdad quiere saber quien va a gastarse la divisa, así que se calcula en vez
   de escribirla a mano. */
function pctCorona(tipo){
  const T=TIPOS_SOBRE[tipo];
  const totOros=Object.values(T.oros).reduce((a,b)=>a+b,0);
  const totNiv=Object.values(T.nivel).reduce((a,b)=>a+b,0);
  const pCorona=T.nivel.corona/totNiv;
  let p=0;
  for(const [n,peso] of Object.entries(T.oros))
    p+=(peso/totOros)*(1-Math.pow(1-pCorona,+n));
  return p*100;
}
const orosTexto=tipo=>{
  const k=Object.keys(TIPOS_SOBRE[tipo].oros).map(Number).sort((a,b)=>a-b);
  return `${k[0]}-${k[k.length-1]} oros`;
};

/* ── RECICLAJE ────────────────────────────────────────────────────────────
   Dos reglas duras:

   1. La PRIMERA copia de una carta no se recicla jamás. Da igual lo floja que sea:
      si la reciclas pierdes la carta de la colección, y un juego de coleccionar no
      puede dejarte destruir lo único que tienes de alguien. Solo se reciclan repetidos.

   2. Una ficha sale de UN SOLO TRAMO. No se juntan tres platas y un oro para completar
      una: cada tramo tiene su cuenta y sus restos se quedan donde están. */
const repesDe=cid=>Math.max(0,S.coleccion.filter(x=>x.cid===cid).length-1);

// ¿Es esta instancia concreta reciclable? Lo es si NO es la última copia que queda
// de esa carta y no está alineada.
function reciclable(iid){
  const it=inst(iid); if(!it) return false;
  if(Object.values(S.plantilla).includes(iid)) return false;
  return repesDe(it.cid)>0;
}

// Cuántas fichas dan estos repetidos, tramo por tramo, y qué sobra en cada uno.
function cuentaReciclaje(iids){
  const porTramo={};
  for(const iid of iids){
    const it=inst(iid); if(!it) continue;
    const t=tramoDe(PORID[it.cid]);
    (porTramo[t]=porTramo[t]||[]).push(iid);
  }
  let fichas=0; const detalle={};
  for(const [t,lista] of Object.entries(porTramo)){
    const n=TRAMOS[t].repes;
    detalle[t]={tengo:lista.length, porFicha:n, fichas:Math.floor(lista.length/n),
      faltan:(lista.length%n)?n-(lista.length%n):0};
    fichas+=detalle[t].fichas;
  }
  return {fichas, detalle};
}

/* Recicla solo lo que completa fichas enteras, y por tramos. Lo que sobra se devuelve
   a la colección en vez de desaparecer: destruir cartas que no han pagado nada sería
   cobrar dos veces. */
function reciclar(iids){
  const validos=iids.filter(reciclable);
  const porTramo={};
  for(const iid of validos){
    const t=tramoDe(PORID[inst(iid).cid]);
    (porTramo[t]=porTramo[t]||[]).push(iid);
  }
  let g=0;
  for(const [t,lista] of Object.entries(porTramo)){
    const n=TRAMOS[t].repes;
    const gasta=Math.floor(lista.length/n)*n;
    if(!gasta) continue;
    g+=gasta/n;
    const fuera=new Set(lista.slice(0,gasta));
    S.coleccion=S.coleccion.filter(x=>!fuera.has(x.iid));
  }
  S.fichas+=g; guardar(); return g;
}
function copias(cid){ return S.coleccion.filter(x=>x.cid===cid).length; }

/* Sets de colección.

   La base de datos real no trae gimnasio ni nacionalidad, así que los sets se arman con
   lo que sí hay: la división y el atributo de la carta. Son agrupaciones que el jugador
   entiende sin explicación —"los cinco mejores pesados", "cuatro Veteranos"— y que se
   pueden perseguir mirando la colección. */
function construirSets(){
  const out=[];
  for(const d of DIVISIONES){
    const req=ordenar(ROSTER.filter(c=>c.division===d.id&&c.rareza==='oro')).slice(0,4).map(c=>c.id);
    if(req.length===4) out.push({id:'div-'+d.id,n:'Élite de '+d.n,req,premio:'top5'});
  }
  for(const t of Object.keys(RASGOS)){
    const req=ordenar(ROSTER.filter(c=>c.rasgos.some(r=>r.tipo===t))).slice(-4).map(c=>c.id);
    if(req.length===4) out.push({id:'ras-'+t,n:RASGOS[t].ic+' Escuela '+RASGOS[t].n,req,premio:'oro'});
  }
  /* Nacionalidad. Estados Unidos y Brasil son el 58% del roster, así que un set de país
     completo con ellos sería inalcanzable: se piden los cuatro mejores de cada país, no
     todos. Y se cuenta por peleador, no por carta — si no, tener a Pereira daría tres
     casillas brasileñas por un solo hombre. */
  const porPais={};
  for(const c of ordenar(ROSTER)){
    const p=porPais[c.pais]=porPais[c.pais]||{vistos:new Set(),req:[]};
    if(p.vistos.has(c.persona)||p.req.length>=4) continue;
    p.vistos.add(c.persona); p.req.push(c.id);
  }
  for(const [pais,p] of Object.entries(porPais)){
    if(p.req.length<4) continue;                  // países con menos de cuatro no dan set
    out.push({id:'pai-'+pais,n:'Bandera · '+pais,req:p.req,premio:'oro'});
  }
  return out;
}
let SETS=[];
const setListo=s=>s.req.every(cid=>copias(cid)>0);

/* ══════════════════════════════════════════════════════════════════════════
   5b. AMIGOS Y CÓDIGOS DE SALA
   ─────────────────────────────────────────────────────────────────────────
   El PvP en vivo necesita un servidor: cartas ocultas significa que el rival no
   puede vivir en tu móvil, y sin servidor autoritativo cualquiera lee la plantilla
   contraria. Eso es la Fase 5 del plan de proyecto.

   Lo que sí funciona hoy, sin servidor y sin cuentas, es esto: tu plantilla se
   convierte en un código de texto que mandas por donde quieras. Quien lo pega te
   añade y puede pelear contra tu plantilla real cuando le dé la gana. El resultado
   vuelve como otro código. Cero infraestructura, cero permisos, funciona sin
   cobertura y no se cae nunca.
   ══════════════════════════════════════════════════════════════════════════ */

const b64e=s=>btoa(unescape(encodeURIComponent(s))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const b64d=s=>decodeURIComponent(escape(atob(s.replace(/-/g,'+').replace(/_/g,'/'))));
const suma=s=>{let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))%1296;
  return h.toString(36).padStart(2,'0')};

function codificar(pre,obj){ const p=b64e(JSON.stringify(obj)); return `${pre}.${p}.${suma(p)}`; }
function decodificar(pre,txt){
  const t=(txt||'').trim().replace(/\s+/g,'');
  const p=t.split('.');
  if(p.length!==3||p[0].toUpperCase()!==pre) return {error:'Ese no parece un código de '+(pre==='JA1'?'plantilla':'resultado')+'.'};
  if(suma(p[1])!==p[2]) return {error:'El código está incompleto o mal copiado. Cópialo entero.'};
  try{ return {ok:JSON.parse(b64d(p[1]))}; }catch(e){ return {error:'El código está dañado.'}; }
}

const miCodigo=()=>plantillaCompleta()
  ? codificar('JA1',{n:(S.nombre||'Jugador').slice(0,20),
      c:DIVISIONES.map(d=>inst(S.plantilla[d.id]).cid)})
  : null;

// Un código de fuera nunca se cree a la primera: si trae basura, la partida
// reventaría a mitad y parecería un bug del juego.
function validarPlantilla(ids){
  if(!Array.isArray(ids)||ids.length!==11) return 'La plantilla del código no tiene 11 cartas.';
  const cartas=ids.map(id=>PORID[id]);
  if(cartas.some(c=>!c)) return 'El código trae cartas que esta versión del juego no conoce. Comprobad que tenéis la misma versión.';
  if(cartas.some(c=>!c.alineable)) return 'El código trae cartas que no son alineables.';
  if(new Set(cartas.map(c=>c.division)).size!==11) return 'La plantilla del código no cubre las 11 divisiones.';
  if(new Set(cartas.map(c=>c.persona)).size!==11) return 'La plantilla del código repite peleador.';
  return null;
}

function anadirAmigo(txt){
  const r=decodificar('JA1',txt);
  if(r.error) return r.error;
  const mal=validarPlantilla(r.ok.c);
  if(mal) return mal;
  const nombre=String(r.ok.n||'Amigo').slice(0,20);
  const yaEsta=S.amigos.find(a=>a.nombre.toLowerCase()===nombre.toLowerCase());
  if(yaEsta){ yaEsta.cartas=r.ok.c; yaEsta.actualizado=Date.now(); guardar();
    return {aviso:`Plantilla de ${nombre} actualizada.`}; }
  S.amigos.push({id:'a'+Math.random().toString(36).slice(2,9),nombre,cartas:r.ok.c,
    actualizado:Date.now(),g:0,p:0});
  guardar(); return {aviso:`${nombre} añadido.`};
}

const codigoResultado=(amigo,marcador,gane)=>codificar('JAR',
  {n:(S.nombre||'Jugador').slice(0,20),v:amigo.nombre,m:[marcador.j,marcador.r],g:gane?1:0});

function registrarResultado(txt){
  const r=decodificar('JAR',txt);
  if(r.error) return r.error;
  const a=S.amigos.find(x=>x.nombre.toLowerCase()===String(r.ok.n||'').toLowerCase());
  if(!a) return `El resultado viene de "${esc(r.ok.n||'?')}", que no está en tu lista de amigos. Añádelo primero con su código de plantilla.`;
  // Viene desde el lado del amigo, así que su victoria es tu derrota
  if(r.ok.g) a.g++; else a.p++;
  guardar();
  return {aviso:`Registrado: ${a.nombre} ${r.ok.g?'ganó':'perdió'} ${r.ok.m[0]}-${r.ok.m[1]}.`};
}

/* ══════════════════════════════════════════════════════════════════════════
   6b. RED — partidas en vivo por sala
   ─────────────────────────────────────────────────────────────────────────
   En online el cliente no calcula nada: manda lo que quiere hacer y pinta lo que
   el servidor le devuelve. El estado llega ya recortado (sin las cartas del rival
   sin resolver) y con los lados volteados, de modo que cada jugador se ve siempre
   como 'j' y todas las pantallas de partida sirven sin tocarlas.
   ══════════════════════════════════════════════════════════════════════════ */
let MODO='local', RED=null, SALA=null;
const CHAT=[];              // historial de la partida en directo
let CUENTA=null;            // temporizador visual de los 25 segundos

/* El reloj se pinta solo, sin repintar la pantalla entera cada segundo: un render por
   segundo se comería los toques del jugador justo cuando más prisa tiene. */
function arrancarCuenta(){
  if(CUENTA) clearInterval(CUENTA);
  CUENTA=setInterval(()=>{
    const el=document.getElementById('reloj');
    if(!el||!P||!P.limite){ if(!el){clearInterval(CUENTA);CUENTA=null;} return; }
    const q=Math.max(0,Math.ceil((P.limite-Date.now())/1000));
    el.textContent=q;
    el.className='reloj'+(q<=8?' urgente':'');
  },250);
}
function relojHTML(){
  if(!online()||!P||!P.limite||P.fase==='fin') return '';
  const q=Math.max(0,Math.ceil((P.limite-Date.now())/1000));
  return `<div class="reloj-caja"><span class="reloj${q<=8?' urgente':''}" id="reloj">${q}</span>
    <span class="tiny">segundos para decidir</span></div>`;
}
const online=()=>MODO==='online';
// La dirección viene puesta de fábrica en el APK. Lo que el jugador guarde a mano
// tiene prioridad, que es lo que permite apuntar a un servidor local al desarrollar.
const servidorDeFabrica=()=>String(window.SERVIDOR_POR_DEFECTO||'').trim().replace(/\/+$/,'');
const servidorURL=()=>String(S.servidor||'').trim().replace(/\/+$/,'')||servidorDeFabrica();
const servidorEsManual=()=>!!String(S.servidor||'').trim();
// Se acepta como la peguen: con espacios, sin https://, con barra final o con
// una ruta pegada de más. Rechazar por una barra sería absurdo.
function normalizarServidor(txt){
  let v=String(txt||'').trim().replace(/\s+/g,'');
  if(!v) return '';
  if(!/^https?:\/\//i.test(v)) v='https://'+v;
  try{ const u=new URL(v); return u.origin; }catch(e){ return null; }
}
// Tres veredictos distintos, porque el arreglo es distinto en cada caso.
async function probarServidor(url){
  try{
    const r=await fetch(url+'/',{method:'GET'});
    if(!r.ok) return {ok:false,txt:`Responde con un error ${r.status}. ¿Sigue desplegado el servidor?`};
    const j=await r.json().catch(()=>null);
    if(j&&j.servicio==='jaula-abierta') return {ok:true,txt:'Funciona. Ya podéis crear una sala.'};
    return {ok:false,txt:'Esa dirección responde, pero no es el servidor del juego. Revisa que sea la que salió al desplegarlo.'};
  }catch(e){
    return {ok:false,txt:'No contesta. Comprueba que tienes conexión y vuelve a probar en un rato.'};
  }
}
function miId(){
  if(!S.jugadorId){ S.jugadorId='j'+Math.random().toString(36).slice(2,12); guardar(); }
  return S.jugadorId;
}
function enviarRed(o){ if(RED&&RED.readyState===1) RED.send(JSON.stringify(o)); }

function conectar(codigo){
  const base=servidorURL();
  if(!base) return avisoCodigo('Falta la dirección del servidor. Ponla en Amigos → Servidor.');
  if(!plantillaCompleta()) return avisoCodigo('Completa las 11 divisiones antes de jugar online.');
  try{ if(RED) RED.close(); }catch(e){}
  MODO='online'; P=null;
  SALA={codigo,estado:'conectando',jugadores:[]};
  vista='online'; tmp={}; render();

  const url=base.replace(/^http/,'ws')+'/sala/'+encodeURIComponent(codigo)
    +'?jugador='+encodeURIComponent(miId());
  let ws;
  try{ ws=new WebSocket(url); }catch(e){ SALA.estado='error'; SALA.motivo=String(e); return render(); }
  RED=ws;

  ws.onopen=()=>{
    SALA.estado='en sala';
    enviarRed({t:'unirse',nombre:S.nombre||'Jugador',
      cartas:DIVISIONES.map(d=>inst(S.plantilla[d.id]).cid)});
    render();
  };
  ws.onmessage=e=>{
    let m; try{ m=JSON.parse(e.data); }catch(err){ return; }
    if(m.t==='sala'){ SALA.jugadores=m.jugadores||[]; SALA.tuLado=m.tuLado;
      if(vista!=='partida') render(); return; }
    if(m.t==='estado'){
      P=m.P;
      if(vista!=='partida'){ vista='partida'; tmp={}; }
      else { tmp.divSel=null; tmp.statSel=null; tmp.jugada=null; }
      arrancarCuenta();
      render(); return;
    }
    if(m.t==='chat'){
      CHAT.push(m); if(CHAT.length>60) CHAT.shift();
      if(m.lado==='r') CHAT.sinLeer=(CHAT.sinLeer||0)+1;
      render(); return;
    }
    if(m.t==='error'){
      tmp.jugada=null;
      ov(`<div class="center"><div style="font-size:34px">⚠️</div><h3>El servidor lo rechaza</h3>
        <div class="sub mb">${esc(m.motivo||'')}</div>
        <button class="btn" data-a="cerrarov">Vale</button></div>`);
      return;
    }
  };
  ws.onclose=()=>{ if(SALA&&SALA.estado!=='cerrada'){ SALA.estado='desconectado'; render(); } };
  ws.onerror=()=>{ if(SALA){ SALA.estado='error'; render(); } };
}
function salirDeSala(){
  if(SALA) SALA.estado='cerrada';
  try{ if(RED) RED.close(); }catch(e){}
  RED=null; SALA=null; MODO='local'; P=null;
}

/* ══════════════════════════════════════════════════════════════════════════
   7. IA
   ══════════════════════════════════════════════════════════════════════════ */
/* Plantilla del rival de la IA, ajustada al nivel del jugador. Se mide con la suma de
   stats porque es lo único comparable que hay — y como es interna, sirve para esto
   igual de bien que serviría una media, sin necesidad de inventarse una. */
function plantillaIA(sumaObjetivo){
  const out={}, personas=new Set();
  for(const d of DIVISIONES){
    const pool=alineables().filter(c=>c.division===d.id&&!personas.has(c.persona));
    pool.sort((a,b)=>Math.abs(a.suma-sumaObjetivo)-Math.abs(b.suma-sumaObjetivo));
    const c=pool[ri(0,Math.min(4,pool.length-1))];
    out[d.id]=c; personas.add(c.persona);   // un peleador, un slot
  }
  return out;
}
function iaVeta(P){
  const libres=DIVISIONES.map(d=>d.id).filter(id=>!P.vetados.includes(id));
  // veta donde su carta es peor
  libres.sort((a,b)=>P.cartas.r[a].suma-P.cartas.r[b].suma);
  return libres[0];
}
function iaDeclara(P){
  const libres=librePara(P,'r');
  let mejor=null;
  for(const d of libres) for(const s of P.statsVivas){
    // sin conocer las cartas del rival, valora su propia fuerza en esa casilla
    const v=valorCarta(P,'r',d,s);
    const bonus=(P.cartas.r[d].stats[s]>=85?6:0);
    const sc=v+bonus+Math.random()*4;
    if(!mejor||sc>mejor.sc) mejor={div:d,stat:s,sc};
  }
  return mejor;
}
/* El cambio de división es defensivo, así que la IA lo evalúa al responder, dentro de
   respuestaIA, y no al declarar. Aquí solo queda la elección a ciegas del Incómodo. */
function iaEligeIncomodo(P,opciones){ return pick(opciones); }

let vista='inicio', P=null, tmp={};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* La carta.

   Un solo dibujo para todos los tamaños: el marco es la imagen de fondo y todo lo demás
   va colocado encima en porcentajes medidos sobre ese marco. La ventana grande de arriba
   no lleva foto —no hay derechos de imagen y 398 fotos hincharían la aplicación— así que
   la ocupa el atributo, que es lo que de verdad cambia cómo juegas esa carta. */
/* Las seis casillas de stat, medidas sobre el marco con un cuentapíxeles y no a ojo:
   el rombo donde va el número y el tramo de línea donde va el nombre de la stat.

   `rombo` es la caja SEGURA del rombo, la parte donde es macizo en toda su altura: como
   está inclinado, su rectángulo interior es más estrecho que su ancho aparente, y usar
   el aparente hacía que los números se salieran por el filo. */
/* Las tres alturas salen de medir el propio dibujo del marco columna a columna: los
   rombos ocupan 76,05-78,22%, 82,33-84,49% y 88,71-90,88%. */
const FILAS_STAT = [
  {rombo:'76.05%', linea:'75.32%'},
  {rombo:'82.33%', linea:'81.55%'},
  {rombo:'88.71%', linea:'87.92%'},
];
const COLS_STAT = [
  {rombo:'17.2%,5.2%',  linea:'24.2%,21.2%'},
  {rombo:'56.1%,5.2%',  linea:'63.1%,20.9%'},
];

function cartaHTML(c,o={}){
  if(!c) return `<div class="carta oculta">?</div>`;
  if(o.oculta) return `<div class="carta tapada">?</div>`;
  const aj=o.ajuste||{};

  const st=STATS.map((s,i)=>{
    const base=c.stats[s.id], d=aj[s.id]||0, v=base+d;
    const f=FILAS_STAT[i>>1], col=COLS_STAT[i&1];
    const [rx,rw]=col.rombo.split(','), [lx,lw]=col.linea.split(',');
    return `<div class="c-num ${d<0?'pen':d>0?'up':''}" style="left:${rx};width:${rw};top:${f.rombo}">${v}</div>
      <div class="c-et" style="left:${lx};width:${lw};top:${f.linea}">${s.n}</div>`;
  }).join('');

  const r=c.rasgos[0];
  const bnd=banderaSrc(c.pais);
  const nCop=o.copias&&o.copias>1?`<div class="c-copias">×${o.copias}</div>`:'';
  /* Destapado por partes, para la apertura de sobres. Las clases se acumulan: con
     've-record' puesta ya están puestas también 've-pais' y 've-peso'. Se hace con
     clases y no con un selector por nivel para que funcione en cualquier motor. */
  const rev=o.rev?('revelando '+o.rev.map(k=>'ve-'+k).join(' ')):'';
  return `<div class="carta ${c.rareza} ${o.compacta?'compacta':''} ${o.sel?'sel':''} ${rev}" ${o.attr||''}>
    <div class="c-rk">${etiquetaEstatus(c)}<i class="brillo"></i></div>
    ${nCop}
    <div class="c-mid">
      <div class="c-icono">${r?RASGOS[r.tipo].ic:'🥊'}</div>
      ${r?`<div class="c-rasgo">${RASGOS[r.tipo].n}${r.plus?'+':''}${r.stat?' · '+r.stat.toUpperCase():''}</div>`:''}
    </div>
    <div class="c-record">${esc(c.record||'')}</div>
    <div class="c-nom" style="--nom:${tamNombre(c.nombre)}">${esc(c.nombre)}<i class="brillo"></i></div>
    ${st}
    <div class="c-pie${bnd?'':' sinbandera'}">
      ${bnd?`<img class="bnd" src="${bnd}" alt="${esc(c.pais)}" loading="lazy">`:''}
      <span class="peso">${SIGLA_DIV[c.division]}</span>
    </div>
  </div>`;
}

/* Las rejillas de cartas se estiran hasta llenar la pantalla, y ninguna se desplaza.

   Una pantalla de cartas que hay que recorrer con el dedo no se lee de un vistazo, y en
   este juego mirar las cartas ES el juego. Así que en vez de dejar que la rejilla crezca
   hacia abajo, se mide el hueco real que queda y las cartas se estiran o encogen para
   llenarlo exactamente.

   Cuánto sitio hay depende del móvil, del alto de la barra de abajo y de lo que haya
   encima y debajo de la rejilla, así que no se puede dejar escrito en el CSS: se mide
   después de cada pintado.

   Cualquier rejilla marcada con data-fit="columnas,filas" entra por aquí. */
function ajustarRejillas(){
  for(const g of document.querySelectorAll('[data-fit]')){
    const [cols,filas]=g.dataset.fit.split(',').map(Number);
    if(!cols||!filas) continue;
    const HUECO=parseFloat(getComputedStyle(g).gap)||6;
    const PIE=g.dataset.pie?parseFloat(g.dataset.pie):0;   // el rótulo bajo cada carta
    const arriba=g.getBoundingClientRect().top;
    /* Lo que ocupa lo que va DEBAJO de la rejilla, más el hueco que el body ya reserva
       para la barra de navegación. Sumar además el alto de la barra sería contarla dos
       veces, que es lo que dejaba las cartas más pequeñas de lo que podían ser. */
    let abajo=parseFloat(getComputedStyle(document.body).paddingBottom)||0;
    for(let e=g.nextElementSibling;e;e=e.nextElementSibling){
      const r=e.getBoundingClientRect();
      if(r.height) abajo+=r.height+8;
    }
    const alto=Math.max(120, innerHeight-arriba-abajo-12);
    const porFila=(alto-HUECO*(filas-1))/filas;
    let ancho=(porFila-PIE)*620/877;
    const tope=(g.parentElement.clientWidth-HUECO*(cols-1))/cols;
    ancho=Math.max(46, Math.min(ancho, tope));
    g.style.setProperty('--rejilla', (ancho*cols+HUECO*(cols-1)).toFixed(1)+'px');
  }
}

/* Le dice a cada carta lo ancha que es/* Le dice a cada carta lo ancha que es, en píxeles, y con eso escala su texto.
   Se leen TODOS los anchos y luego se escriben TODOS: mezclarlos obligaría al
   navegador a recalcular la página una vez por carta, y en la colección hay
   cuatrocientas. */
function medirCartas(raiz){
  const cartas=(raiz||document).querySelectorAll('.carta');
  if(!cartas.length) return;
  const anchos=new Array(cartas.length);
  for(let i=0;i<cartas.length;i++) anchos[i]=cartas[i].getBoundingClientRect().width;
  for(let i=0;i<cartas.length;i++)
    if(anchos[i]) cartas[i].style.setProperty('--cw', anchos[i].toFixed(2)+'px');
}

// Girar el móvil o abrir el teclado cambia el ancho de las cartas, así que se rehace la cuenta.
addEventListener('resize', ()=>{ ajustarRejillas(); medirCartas(); });

function ir(v){ pararAviso(); vista=v; tmp={}; window.scrollTo(0,0); render(); }

// Los relojes se refrescan solos sin volver a pintar la pantalla entera:
// un render completo cada segundo se comería los toques del jugador.
function actualizarRelojes(){
  for(const g of GRATIS){
    const b=document.querySelector(`[data-reloj="${g.id}"]`);
    if(!b) continue;
    const ok=listoGratis(g);
    b.textContent=ok?'Reclamar':reloj(restaGratis(g));
    b.disabled=!ok;
    const panel=b.closest('.card-panel');
    if(panel) panel.style.borderColor=ok?'var(--acc)':'';
  }
  const listos=nGratisListos();
  if(actualizarRelojes.ultimo===undefined) actualizarRelojes.ultimo=listos;
  if(listos!==actualizarRelojes.ultimo){    // acaba de caducar un reloj: repinta
    actualizarRelojes.ultimo=listos; render(); return;
  }
  const badge=document.querySelector('#nav .badge');
  const n=S.sobres.length+listos;
  if(badge && badge.textContent!==String(n)) badge.textContent=n;
}

/* ── SONIDO ──
   Sintetizado con Web Audio, sin un solo archivo. Tres razones y en este orden:
   no hay licencias que arrastrar —y este proyecto ya carga con las de usar
   peleadores reales—, no suma un byte al APK ni al IPA, y funciona sin conexión.
   Cuando el juego tenga sonido de verdad se sustituye aquí dentro y nada más
   se entera.

   Los móviles no dejan sonar nada hasta que el jugador toca la pantalla, así que
   el contexto se crea en el primer toque y no antes. Si el motor no trae Web Audio
   —o falla por lo que sea— todo esto se queda mudo y el juego sigue igual. */
const SONIDO={
  ctx:null,
  activar(){                     // hay que llamarlo DENTRO de un toque
    if(S.mudo) return null;
    try{
      const AC=window.AudioContext||window.webkitAudioContext;
      if(!AC) return null;
      if(!this.ctx) this.ctx=new AC();
      if(this.ctx.state==='suspended') this.ctx.resume();
      return this.ctx;
    }catch(e){ return null; }
  },
  // Un tono con su envolvente. Todo lo demás se construye con esto.
  tono({f=220, f2=null, t=0.3, tipo='sine', vol=0.2, retraso=0}={}){
    const c=this.activar(); if(!c) return;
    const t0=c.currentTime+retraso;
    const osc=c.createOscillator(), g=c.createGain();
    osc.type=tipo;
    osc.frequency.setValueAtTime(f,t0);
    if(f2) osc.frequency.exponentialRampToValueAtTime(Math.max(f2,1),t0+t);
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.exponentialRampToValueAtTime(vol,t0+Math.min(0.02,t*0.15));
    g.gain.exponentialRampToValueAtTime(0.0001,t0+t);
    osc.connect(g).connect(c.destination);
    osc.start(t0); osc.stop(t0+t+0.05);
  },
  // Ruido corto: es lo que da el cuerpo del golpe, un tono solo suena a pitido.
  golpe({t=0.18, vol=0.25, corte=1400, retraso=0}={}){
    const c=this.activar(); if(!c) return;
    const t0=c.currentTime+retraso, n=Math.floor(c.sampleRate*t);
    const buf=c.createBuffer(1,n,c.sampleRate), d=buf.getChannelData(0);
    for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2.2);
    const src=c.createBufferSource(); src.buffer=buf;
    const f=c.createBiquadFilter(); f.type='lowpass'; f.frequency.value=corte;
    const g=c.createGain(); g.gain.value=vol;
    src.connect(f).connect(g).connect(c.destination);
    src.start(t0);
  },

  /* Un dato que cae. Cada uno entra más agudo que el anterior, así que la propia
     escalera de tonos va contando cuánto queda para ver la carta. El del ranking
     —el último y el que más dice— entra más fuerte y con un golpe detrás. */
  dato(i, total, nivel, gordo){
    const N=NIVEL_APERTURA[nivel]||NIVEL_APERTURA.oro;
    const paso=total>1?i/(total-1):1;
    const f=N.hz[0]+(N.hz[1]-N.hz[0])*paso;
    this.tono({f, t:0.20, tipo:'triangle', vol:gordo?0.15:0.10});
    this.tono({f:f*2, t:0.11, tipo:'sine', vol:gordo?0.09:0.05});
    if(gordo) this.golpe({t:0.14, vol:0.14, corte:N.corte});
  },
  /* El impacto de cuando la carta aterriza. */
  impacto(nivel){
    const N=NIVEL_APERTURA[nivel]||NIVEL_APERTURA.oro;
    this.golpe({t:N.pegada, vol:0.22, corte:N.corte});
    this.tono({f:N.hz[1]*0.75, f2:N.hz[1]*0.36, t:0.34, tipo:'triangle', vol:0.13});
    // La campana del octógono, solo para la corona. Es lo único reservado.
    if(nivel==='corona'){
      for(const [r,f] of [[0.02,880],[0.02,1320],[0.30,880],[0.30,1320]])
        this.tono({f, t:1.5, tipo:'sine', vol:0.10, retraso:r});
    }
  },
  clic(){ this.tono({f:520, f2:340, t:0.07, tipo:'square', vol:0.05}); },

  /* EL ANUNCIO. Es el único sonido del juego que no está sintetizado: un archivo de
     verdad, y suena solo cuando la mejor carta del sobre es un campeón o un top 5.
     Reservarlo es lo que lo mantiene vivo: si sonara en cada sobre, al décimo sería
     ruido y además taparía lo que el sonido de siempre ya cuenta —lo grave o agudo
     que entra te dice el nivel antes de ver nada.

     Va con <audio> y no con Web Audio a propósito. Web Audio necesita el archivo
     descodificado, y para eso hay que leerlo con fetch(); el juego se abre también
     con file://, donde fetch() no puede leer el archivo de al lado. <audio> sí. */
  clip:null,
  /* Cada arranque y cada corte llevan número. Sin él, abrir dos sobres de campeón
     seguidos mataba el segundo anuncio: el fundido del primero seguía corriendo y,
     al cumplirse su cuarto de segundo, paraba el clip que acababa de empezar. */
  vez:0,
  anuncio(){
    if(S.mudo) return;
    try{
      if(!this.clip){ this.clip=new Audio('sonidos/its-time.mp3'); this.clip.preload='auto'; }
      this.vez++;                       // cualquier fundido pendiente deja de mandar
      this.clip.currentTime=0;
      this.clip.volume=1;
      const p=this.clip.play();
      if(p&&p.catch) p.catch(()=>{});   // si el navegador lo bloquea, el juego sigue igual
    }catch(e){}
  },
  /* Cuando el jugador se salta la revelación hay que callar el anuncio. Pararlo en seco
     suena a que algo ha fallado, así que se baja el volumen en un cuarto de segundo. */
  cortarAnuncio(){
    const a=this.clip; if(!a||a.paused) return;
    const mio=++this.vez, t0=performance.now(), v0=a.volume;
    const baja=()=>{
      if(this.vez!==mio) return;        // ha vuelto a sonar: este fundido ya no pinta nada
      const k=(performance.now()-t0)/250;
      if(k>=1){ a.pause(); a.currentTime=0; a.volume=v0; return; }
      a.volume=v0*(1-k);
      requestAnimationFrame(baja);
    };
    requestAnimationFrame(baja);
  },
};

/* Lo que dura el anuncio, medido sobre el propio archivo. Los momentos de la
   revelación de abajo están puestos contra él. */
const ANUNCIO_MS=8890;

/* Lo que define cada nivel en la apertura: cuánto dura el aviso, de qué color es,
   y a qué suena. Una sola tabla para animación y sonido, para que no puedan
   contarte cosas distintas. */
const NIVEL_APERTURA={
  /* Campeón y top 5 llevan el anuncio, y entonces manda el clip: la carta se llena a su
     ritmo y no al revés. Los momentos están puestos sobre la propia forma del audio —
     la voz entra a los 0,9 s, y entre el 5,7 y el 6,4 hay un valle antes del tramo
     final, que es donde entra el peleador con sus stats. */
  corona:{n:'corona', paso:700, hz:[150,760], pegada:0.34, corte:2600,
          luz:'#ffd24a', luz2:'#ff4a3d',
          anuncio:true, momentos:[900,2100,3400,4900,6500,ANUNCIO_MS]},
  top5  :{n:'top5',   paso:560, hz:[150,620], pegada:0.28, corte:2100,
          luz:'#ffcf3f', luz2:'#e8a021',
          anuncio:true, momentos:[900,2100,3400,4900,6500,ANUNCIO_MS]},
  top10 :{n:'top10',  paso:430, hz:[160,500], pegada:0.22, corte:1700,
          luz:'#dfe6ee', luz2:'#9fb4c8'},
  top15 :{n:'top15',  paso:430, hz:[160,440], pegada:0.19, corte:1500,
          luz:'#cfd6de', luz2:'#8d9aa8'},
  oro   :{n:'oro',    paso:340, hz:[170,370], pegada:0.16, corte:1200,
          luz:'#b9c1ca', luz2:'#79838f'},
  plata :{n:'plata',  paso:340, hz:[170,330], pegada:0.14, corte:1100,
          luz:'#aab2bb', luz2:'#6e7883'},
};

/* ── APERTURA DE SOBRES ──
   Pantalla propia con su propio estado, para que el atrás funcione en cualquier
   momento. Las cartas ya están en la colección antes de revelarse: salir a medias
   no pierde nada, solo se salta la animación.

   Dos pasos y ya: la mejor carta del sobre a pantalla casi completa, se toca, y sale
   el sobre entero. Antes se iban pasando las nueve una a una, que para nueve cartas
   son ocho toques de trámite. */
function abrirTanda(items,tipo){
  vista='apertura';
  const mejor=items.length?PORID[items[0].cid]:null;
  tmp={ap:{items,tipo,resumen:items.length===0,
    nivel:mejor?(mejor.estatus==='campeon'||mejor.estatus==='top5'
      ?(mejor.estatus==='campeon'?'corona':'top5'):mejor.estatus):'plata',
    fase:items.length?'aviso':'resumen',
    nuevas:items.filter(it=>S.coleccion.filter(x=>x.cid===it.cid).length===1).map(it=>it.iid)}};
  window.scrollTo(0,0); render();
  arrancarAviso();
}

/* El aviso: la carta se destapa por partes, y en un orden que va de lo que menos
   dice a lo que más — nacionalidad, peso, récord, ranking, y al final la foto con
   las stats. Cada dato que cae estrecha el cerco: cuando ya sabes que es un pesado
   invicto, el ranking es la última carta boca abajo.

   El color de todo el bloque va del nivel que viene, así que además de los datos
   la pantalla te está diciendo desde el principio si viene algo bueno. Es a
   propósito: esa tensión es el momento que engancha, más que la carta en sí.

   Dos condiciones para que no canse: dura poco —1,4 s por una plata, 1,7 s por un oro—
   y **se salta tocando**. Quien va por su sobre número cuarenta no puede estar obligado
   a mirarlo entero.

   La excepción es el campeón y el top 5, que van con el anuncio y duran los 8,9 s que
   dura el clip. Ahí la espera ES el premio, y por eso mismo no se le da a nada más: si
   sonara en cada sobre dejaría de significar que ha caído algo gordo. Y se sigue
   pudiendo saltar, que corta el anuncio con un fundido. */
function pasosAviso(c){
  // Nacionalidad, peso, récord, ranking, y al final la foto con las stats. Cada uno
  // aparece EN SU SITIO de la carta, no en una lista aparte: lo que se está viendo
  // es la carta llenándose.
  const p=[
    {k:'pais',   et:'Nacionalidad'},
    {k:'peso',   et:'Peso'},
    {k:'record', et:'Récord'},
  ];
  // El ranking solo si lo tiene. En una carta sin rankear no hay nada que destapar,
  // y una pestaña vacía encendiéndose sería peor: parecería que falla algo.
  if(c.rk===0||c.rk) p.push({k:'rk', et:'Ranking', gordo:true});
  p.push({k:'todo', et:'El peleador', gordo:true});
  return p;
}
/* Cuándo sale cada paso, en milisegundos desde que arranca la revelación. La lista tiene
   un valor más que pasos: el último es cuándo se suelta la carta. */
function momentosAviso(N,n){
  if(N.anuncio){
    if(N.momentos&&N.momentos.length===n+1) return N.momentos;
    /* Reparto de emergencia. Si algún día cambian los pasos y la lista de momentos se
       queda corta, lo importante es que el anuncio y la revelación sigan acabando a la
       vez; descuadrados quedan mucho peor que mal repartidos. */
    return Array.from({length:n+1},(_,i)=>Math.round(ANUNCIO_MS*(i+1)/(n+1)));
  }
  return Array.from({length:n+1},(_,i)=>i*N.paso);
}
/* Los pasos se programan TODOS de golpe contra el mismo cero, no uno detrás de otro.
   Encadenándolos, cada retraso del navegador se sumaba al siguiente y la revelación se
   iba estirando; con el anuncio eso sería fatal, porque acabaría descuadrada del audio.
   Programándolos contra un cero común, un tirón atrasa un paso y no arrastra a los demás. */
function arrancarAviso(){
  pararAviso();
  const a=tmp.ap; if(!a||a.fase!=='aviso') return;
  const N=NIVEL_APERTURA[a.nivel]||NIVEL_APERTURA.oro;
  const pasos=pasosAviso(PORID[a.items[0].cid]);
  const cuando=momentosAviso(N,pasos.length);
  a.paso=N.anuncio?0:(a.paso||0);
  if(N.anuncio) SONIDO.anuncio();
  arrancarAviso.t=pasos.map((p,i)=>setTimeout(()=>{
    if(!tmp.ap||tmp.ap!==a||a.fase!=='aviso') return;
    // Con anuncio, el clip ES el sonido: los tonos encima solo estorbarían.
    if(!N.anuncio) SONIDO.dato(i, pasos.length, a.nivel, p.gordo);
    /* Se le añade la clase A LA CARTA QUE YA ESTÁ, no se repinta la pantalla. Repintando,
       el navegador crea elementos nuevos y vuelve a lanzar la animación de entrada de todo
       lo que ya estaba visible: la carta entera parpadea en cada paso. */
    const carta=document.querySelector('.aviso .carta');
    if(carta) carta.classList.add('ve-'+p.k);
    else render();
    a.paso=i+1;
  }, cuando[i]));
  arrancarAviso.t.push(setTimeout(soltarCarta, cuando[pasos.length]));
}
/* Corta la revelación entera: los pasos que faltaban y el anuncio si estaba sonando.
   Vale para las dos salidas —el final de siempre y el salto del jugador— porque al
   final natural el clip ya ha terminado y cortarlo no hace nada. */
function pararAviso(){
  const t=arrancarAviso.t;
  if(Array.isArray(t)) t.forEach(clearTimeout); else clearTimeout(t);
  arrancarAviso.t=[];
  SONIDO.cortarAnuncio();
}
/* Soltar la carta NO repinta nada. Se le añaden a la que ya está en pantalla las clases
   que faltan y se cambian los dos textos a mano. Repintar aquí destruiría la carta y la
   volvería a crear, y eso se ve como un parpadeo justo en el momento importante. */
function soltarCarta(){
  const a=tmp.ap; if(!a||a.fase!=='aviso'){ pararAviso(); return; }
  const N=NIVEL_APERTURA[a.nivel]||NIVEL_APERTURA.oro;
  pararAviso();
  a.fase='carta';
  // Con anuncio no hay golpe de aterrizaje: el propio clip es el remate.
  if(!N.anuncio) SONIDO.impacto(a.nivel);
  const caja=document.querySelector('.apertura.aviso');
  const carta=caja&&caja.querySelector('.carta');
  if(!caja||!carta){ render(); return; }
  const c=PORID[a.items[0].cid];
  for(const p of pasosAviso(c)) carta.classList.add('ve-'+p.k);
  caja.classList.add('suelta');
  caja.dataset.a='revelar';
  const tit=caja.querySelector('.apertura-tit');
  if(tit&&(c.estatus==='campeon'||c.estatus==='top5')) tit.classList.remove('apagado');
  const et=caja.querySelector('.aviso-et');
  if(et) et.textContent=`${DIV[c.division].n} · ${c.pais||''} · ${c.record||''}`;
  const pie=caja.querySelector('.apertura-pie');
  if(pie) pie.textContent='Toca la carta para ver el sobre entero';
}

function vApertura(){
  const a=tmp.ap;
  const barra=`<div class="row mb" style="align-items:center">
      <button class="btn gho sm" data-a="salirapertura" style="flex:none">← Salir</button>
      <div class="tiny center" style="flex:2">${a.items.length} CARTAS</div>
      <div style="flex:none;width:64px"></div>
    </div>`;

  if(a.resumen){
    const nuevas=a.nuevas.length;
    return barra+`
      <div class="center mb"><h2>${TIPOS_SOBRE[a.tipo].ic} ${TIPOS_SOBRE[a.tipo].n}</h2>
        <div class="sub">${nuevas} nueva${nuevas===1?'':'s'} de ${a.items.length}</div></div>
      <div class="grid fit mb" style="--cols:3" data-fit="3,3" data-pie="12">${a.items.map(it=>{
        const c=PORID[it.cid];
        return `<div>${cartaHTML(c,{attr:`data-carta="${it.iid}"`})}
          <div class="pie-carta">${a.nuevas.includes(it.iid)?'nueva':'repetida'}</div></div>`;
      }).join('')}</div>
      ${/* Solo se encadena lo que ya tienes guardado. El básico se reclama en la
             pantalla de sobres y en ningún otro sitio: encadenarlo aquí convierte
             la apertura en una máquina de tirar de la palanca sin salir nunca. */
        S.sobres.some(s=>s.tipo===a.tipo)
        ? `<button class="btn mb" data-a="abrir" data-t="${a.tipo}">Abrir otro ${TIPOS_SOBRE[a.tipo].n} de los tuyos</button>` : ''}
      <button class="btn sec mb" data-nav="sobres">Volver a los sobres</button>
      <button class="btn gho" data-nav="coleccion">Ver la colección</button>`;
  }

  const N=NIVEL_APERTURA[a.nivel]||NIVEL_APERTURA.oro;

  /* El aviso. La carta ya está ahí, en grande, pero vacía: se va llenando por partes
     —nacionalidad, peso, récord, ranking, y al final el peleador con sus stats—. El
     resplandor va del nivel que viene, así que además la pantalla ya está avisando. */
  /* Aviso y carta comparten EXACTAMENTE el mismo armazón: la misma carta, en el mismo
     sitio, desde el primer momento hasta el final. Lo único que cambia son clases y dos
     textos. Si el HTML fuera distinto, pasar de una fase a otra volvería a crear los
     nodos y la carta desaparecería y volvería un fotograma después: eso es el parpadeo.
     Nunca se sustituye la carta. Solo se le van encendiendo las partes. */
  const c=PORID[a.items[0].cid];
  const todos=pasosAviso(c);
  const enAviso=a.fase==='aviso';
  /* Con anuncio la carta empieza VACÍA: el marco solo, esperando a que entre la voz a los
     0,9 s. Sin anuncio se ve ya el primer dato, que es como ha sido siempre. */
  const vistos=enAviso ? todos.slice(0, N.anuncio ? (a.paso||0) : Math.max(1, a.paso||1)) : todos;
  const ult=vistos[vistos.length-1];
  const gorda=c.estatus==='campeon'||c.estatus==='top5';
  return barra+`
    <div class="apertura aviso${enAviso?'':' suelta'}" data-a="${enAviso?'saltaraviso':'revelar'}"
      style="--luz:${N.luz};--luz2:${N.luz2}">
      <div class="apertura-tit${gorda&&!enAviso?'':' apagado'}">★ ${gorda?EST[c.estatus].n.toUpperCase():''} ★</div>
      <div class="apertura-carta n-${a.nivel}">${cartaHTML(c,{rev:vistos.map(p=>p.k)})}<i class="destello"></i></div>
      <div class="sub center aviso-et">${enAviso?(ult?ult.et:'')
        :`${DIV[c.division].n} · ${esc(c.pais||'')} · ${esc(c.record||'')}`}</div>
      <div class="tiny center apertura-pie">${enAviso?'Toca para saltar':'Toca la carta para ver el sobre entero'}</div>
    </div>`;
}

/* ── COLECCIÓN ── */
function vColeccion(){
  const f=tmp.filtro||{};
  let l=S.coleccion.map(x=>({x,c:PORID[x.cid]}));
  if(f.div) l=l.filter(o=>o.c.division===f.div);
  if(f.rar) l=l.filter(o=>o.c.estatus===f.rar);
  if(f.al==='si') l=l.filter(o=>o.c.alineable);
  if(f.al==='no') l=l.filter(o=>!o.c.alineable);
  l.sort((a,b)=>comparar(a.c,b.c));      // siempre de mejor a peor
  const total=ROSTER.length, distintas=new Set(S.coleccion.map(x=>x.cid)).size;

  /* La colección es un ÁLBUM, no una lista: páginas de 4×4 que se pasan. Una colección
     que se recorre con el dedo hacia abajo no se mira, se escanea, y aquí mirar las
     cartas es medio juego. Con páginas, cada una es una hoja del álbum. */
  const POR_PAG=16;
  const pags=Math.max(1, Math.ceil(l.length/POR_PAG));
  if(tmp.pag===undefined) tmp.pag=0;
  tmp.pag=Math.max(0, Math.min(tmp.pag, pags-1));
  const hoja=l.slice(tmp.pag*POR_PAG, (tmp.pag+1)*POR_PAG);

  return `<div class="pcab"><h2>Colección</h2>
      <span class="sub">${distintas} de ${total} distintas · ${S.coleccion.length} en total</span></div>
    <div class="bar mb"><div style="width:${distintas/total*100}%"></div></div>
    <div class="chips mb">
      <span class="chip ${!f.rar?'on':''}" data-f="rar" data-v="">Todas</span>
      ${ORDEN_ESTATUS.map(r=>`<span class="chip ${f.rar===r?'on':''}" data-f="rar" data-v="${r}">${EST[r].n}</span>`).join('')}
      <span class="chip ${!f.al?'on':''}" data-f="al" data-v="">Todo</span>
      <span class="chip ${f.al==='si'?'on':''}" data-f="al" data-v="si">Alineables</span>
      <span class="chip ${f.al==='no'?'on':''}" data-f="al" data-v="no">Colección</span>
    </div>
    <div class="chips mb">
      <span class="chip ${!f.div?'on':''}" data-f="div" data-v="">Todas</span>
      ${DIVISIONES.map(d=>`<span class="chip ${f.div===d.id?'on':''}" data-f="div" data-v="${d.id}">${d.n}</span>`).join('')}
    </div>
    ${l.length?`
      <div class="grid fit" style="--cols:4" data-fit="4,4">${hoja.map(o=>
        cartaHTML(o.c,{attr:`data-carta="${o.x.iid}"`})).join('')}</div>
      <div class="album-nav">
        <button class="btn gho sm" data-a="pag" data-v="-1" ${tmp.pag?'':'disabled'}>‹</button>
        <span class="pag">HOJA ${tmp.pag+1} DE ${pags}</span>
        <button class="btn gho sm" data-a="pag" data-v="1" ${tmp.pag<pags-1?'':'disabled'}>›</button>
      </div>`
      :'<div class="card-panel sub">Nada con esos filtros.</div>'}`;
}

function vReciclaje(){
  const sel=tmp.sel||[];
  // Solo repetidos: la primera copia de una carta no se recicla jamás.
  const lista=[];
  for(const x of S.coleccion) if(reciclable(x.iid)) lista.push({x,c:PORID[x.cid]});
  lista.sort((a,b)=>comparar(a.c,b.c));
  const {fichas,detalle}=cuentaReciclaje(sel);
  // Por páginas, igual que la colección: los repetidos se cuentan por decenas y una
  // lista que hay que recorrer con el dedo no deja ver lo que estás triturando.
  const POR_PAG=12;
  const pags=Math.max(1, Math.ceil(lista.length/POR_PAG));
  if(tmp.pag===undefined) tmp.pag=0;
  tmp.pag=Math.max(0, Math.min(tmp.pag, pags-1));
  const hoja=lista.slice(tmp.pag*POR_PAG,(tmp.pag+1)*POR_PAG);
  const filas=Object.entries(TRAMOS).map(([id,t])=>{
    const d=detalle[id];
    return `<tr><td>${t.n}</td><td style="text-align:right">${t.repes} repes</td>
      <td style="text-align:right">${d?`${d.tengo} → <b>${d.fichas}</b>${d.faltan?` <span style="color:var(--dim2)">(faltan ${d.faltan})</span>`:''}`:'—'}</td></tr>`;
  }).join('');
  return `<h2>Reciclaje</h2>
    <div class="sub mb"><b>Solo se reciclan repetidos.</b> La primera copia de un peleador no se
    puede destruir nunca, por floja que sea. Y cada ficha sale de <b>un solo tramo</b>: no se juntan
    platas con oros para completarla.</div>
    <div class="card-panel">
      <table style="width:100%"><tr><th>Tramo</th><th style="text-align:right">Por ficha</th><th style="text-align:right">Tienes</th></tr>${filas}</table>
      <div class="divider"></div>
      <div class="row" style="align-items:center">
        <div style="flex:2"><b>${sel.length} seleccionadas</b>
          <div class="sub">${fichas} ficha${fichas===1?'':'s'} enteras</div></div>
        <button class="btn sm" data-a="reciclar" ${fichas<1?'disabled':''}>Reciclar</button>
      </div>
    </div>
    ${hoja.length?`
      <div class="grid fit" style="--cols:4" data-fit="4,3">${hoja.map(o=>cartaHTML(o.c,{
        attr:`data-rec="${o.x.iid}"`,sel:sel.includes(o.x.iid),
        copias:S.coleccion.filter(y=>y.cid===o.x.cid).length})).join('')}</div>
      ${pags>1?`<div class="album-nav">

        <span class="pag">HOJA ${tmp.pag+1} DE ${pags}</span>

/* ══════════════════════════════════════════════════════════════════════════
   9. PANTALLA DE PARTIDA
   ══════════════════════════════════════════════════════════════════════════ */
function empezarPartida(amigo){
  const pj={};
  let sumaPl=0;
  for(const d of DIVISIONES){ pj[d.id]=cartaDe(S.plantilla[d.id]); sumaPl+=pj[d.id].suma; }
  let pr,nombre;
  if(amigo){
    pr={}; for(const id of amigo.cartas){ const c=PORID[id]; pr[c.division]=c; }
    nombre=amigo.nombre;
  }else{ pr=plantillaIA(Math.round(sumaPl/11)+ri(-12,12)); nombre='El rival'; }
  P=nuevaPartida(pj,pr);
  P.rival=nombre; P.amigoId=amigo?amigo.id:null;
  ir('partida');
}

/* ══════════════════════════════════════════════════════════════════════════
   9-bis. PARTIDA TUTORIAL

   Una partida DE VERDAD, con el mismo motor y las mismas reglas: no hay guion ni
   nada simulado, así que todo lo que enseña es cierto y se aprende jugando.

   Lo único preparado son las dos plantillas, elegidas del catálogo para que los
   rasgos salgan seguro — si no, un novato podría terminar el tutorial sin haber
   visto ni un Incómodo. Como no salen de la colección, se puede jugar nada más
   instalar, antes de abrir el primer sobre.

   El entrenador habla cuando toca y no antes: cada aviso está atado al momento en
   que ese concepto aparece en pantalla, y se puede cortar de un botón.
   ══════════════════════════════════════════════════════════════════════════ */

// Plantilla legal (11 divisiones, sin repetir peleador) que además lleva sí o sí
// los rasgos pedidos. Determinista: el catálogo es siempre el mismo.
function plantillaGuiada(rasgosPedidos){
  const pool=alineables(), usados=new Set(), out={};
  for(const t of rasgosPedidos){
    const c=pool.find(x=>!out[x.division]&&!usados.has(x.persona)
      && x.rasgos.some(r=>r.tipo===t&&!r.plus));
    if(c){ out[c.division]=c; usados.add(c.persona); }
  }
  for(const d of DIVISIONES){
    if(out[d.id]) continue;
    const cand=pool.filter(c=>c.division===d.id&&!usados.has(c.persona))
      .sort((a,b)=>Math.abs(a.suma-496)-Math.abs(b.suma-496)); // parejas: que el margen se vea variado
    out[d.id]=cand[0]; usados.add(cand[0].persona);
  }
  return out;
}

function empezarTutorial(){
  P=nuevaPartida(plantillaGuiada(['veterano','especialista','camaleon']),
                 plantillaGuiada(['incomodo','veterano']));
  P.rival='Sparring'; P.amigoId=null;
  P.tutorial=true; P.tutorVistos=[]; P.tutorPaso=null;
  ir('partida');
}

function pasoTutor(){

}
function coachHTML(){
  const p=pasoTutor(); if(!p) return '';
  // Se numera por el paso, no por los vistos: un aviso que no llegó a salir no puede
  // hacer que el contador mienta sobre cuánto queda.
  return `<div class="coach">
    <div class="qn">ENTRENADOR · ${TUTOR.indexOf(p)+1} de ${TUTOR.length}</div>

function logHTML(){

    if(l.t==='sys') return `<div class="log">${esc(l.x)}</div>`;
    const gan=l.ganador==='j';
