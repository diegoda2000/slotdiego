plugins {
    id 'com.android.application'
}

// El juego vive en juego/juego.html, fuera de android/. Se copia a una carpeta
// generada y esa carpeta se añade como origen de assets: así no hay copia duplicada
// del HTML en el repositorio y el APK siempre lleva la versión actual.
def assetsJuego = layout.buildDirectory.dir('juego-assets')

def copiarJuego = tasks.register('copiarJuego', Copy) {
    from(rootProject.file('../juego')) {
        include 'juego.html'
        include 'motor.js'
        include 'roster.js'     // el catálogo de peleadores
        include 'fotos.js'      // qué peleadores tienen foto
        include 'caras.js'      // cómo se encuadra la cara de cada uno
        include 'servidor.js'   // lleva dentro la dirección del servidor de directo
        include 'marcos/**'     // los marcos de las cartas, oro y plata
        include 'fotos/**'      // las caras de los peleadores, recortadas
        include 'banderas/**'   // las 57 banderas
        include 'fuentes/**'    // la tipografía, para que se vea igual sin conexión
        include 'sonidos/**'    // el anuncio de campeón y top 5
        include 'sobres/**'     // el arte de los tres sobres
        include 'arte/**'       // el logo, el fondo y los peleadores de los botones
    }
    into assetsJuego
}

/* LA FIRMA DEL APK DE RELEASE.

   El keystore (android/juego-release.keystore) y sus contraseñas
   (android/keystore.properties) están los dos en .gitignore y NO se suben: el repositorio
   es público, y una clave de firma publicada deja de servir para nada.

   Por eso esto es condicional. Si el keystore está —en una máquina de casa, o escrito por
   el flujo desde su secreto— el release se firma con la clave de verdad; si no está, no se
   define ninguna firma y Gradle hace lo de siempre.

   EL APK PUBLICADO VA FIRMADO ASÍ. El flujo guarda el keystore en un secreto cifrado de
   GitHub (ANDROID_KEYSTORE_B64), lo escribe en su sitio antes de compilar y hace
   `assembleRelease`. Si el secreto falta, compila `assembleDebug` como antes y la descarga
   sigue saliendo: quedarse sin APK por no tener firma sería peor. */
def fKeystore = rootProject.file('juego-release.keystore')
def fPropsFirma = rootProject.file('keystore.properties')

/* La contraseña y el alias salen de DOS sitios, y en este orden:

   1. `android/keystore.properties`, que es lo que hay en una máquina de casa y no se sube.
   2. Las variables de entorno FIRMA_PASS y FIRMA_ALIAS, que es como llegan en el flujo de
      GitHub: el keystore viaja en un secreto cifrado, el flujo lo escribe en su sitio y
      pasa la contraseña por el entorno. Así el APK publicado va firmado con la clave de
      verdad sin que ni el archivo ni la contraseña entren nunca en el repositorio.

   Si no hay ninguno de los dos, no se define firma y Gradle hace lo de siempre. */
def propsFirma = new Properties()
if (fPropsFirma.exists()) fPropsFirma.withInputStream { propsFirma.load(it) }
def clavePass = System.getenv('FIRMA_PASS') ?: propsFirma.getProperty('storePassword')
def claveAlias = System.getenv('FIRMA_ALIAS') ?: propsFirma.getProperty('keyAlias')
def hayFirma = fKeystore.exists() && clavePass && claveAlias

android {
    namespace 'com.jaulaabierta.juego'
    compileSdk 35

    defaultConfig {
        applicationId "com.jaulaabierta.juego"
        minSdk 26
        targetSdk 35
        /* SUBIR LA VERSIÓN es subir `versionCode` en uno. Es lo único que mira Android
           para saber que un APK es una actualización y no otra aplicación, y mientras no
           cambien ni el applicationId ni la firma, la colección del jugador —que vive en
           el localStorage del WebView— no se toca. `versionName` es sólo lo que se lee.
           La frase acordada con el dueño para pedirlo es "sube la versión". */
        versionCode 2
        versionName "0.1.1"
    }

    signingConfigs {
        release {
            if (hayFirma) {
                storeFile fKeystore
                storePassword clavePass
                keyAlias claveAlias
                /* PKCS12 no admite una contraseña distinta para la clave: es la misma del
                   almacén. keytool lo avisa al crearlo y no hay forma de separarlas. */
                keyPassword clavePass
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (hayFirma) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            assets.srcDirs += assetsJuego
        }
    }
}

tasks.named('preBuild') { dependsOn copiarJuego }

dependencies {
    // WebViewAssetLoader: sirve el HTML desde un origen https real en vez de file://,
    // que es lo que hace que localStorage funcione y la colección se guarde.
    implementation 'androidx.webkit:webkit:1.12.1'
    // androidx.core: para preguntarle al sistema cuánto ocupan sus barras y que la hora
    // y la batería no se queden encima de la cabecera del juego.
    implementation 'androidx.core:core:1.13.1'
}
